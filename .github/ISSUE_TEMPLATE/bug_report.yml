name: 🐛 Bug Report
description: Report a bug in a widget, recipe, or the platform
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I've searched existing issues for duplicates
          required: true
        - label: I've tested the latest version
          required: true
  - type: dropdown
    id: component-type
    attributes:
      label: Component Type
      description: What type of component has the bug?
      options:
        - Widget (HTML embed/block)
        - Native Recipe (API install)
        - MCP Server
        - Skill
        - Documentation
        - Build/Tooling
        - Website/UI
    validations:
      required: true
  - type: input
    id: component-slug
    attributes:
      label: Component Slug
      description: The slug from the catalog (e.g., `pomodoro-timer`, `crm-pipeline`)
      placeholder: pomodoro-timer
    validations:
      required: false
  - type: dropdown
    id: delivery-channel
    attributes:
      label: Delivery Channel (widgets only)
      description: How are you using the widget?
      options:
        - Embed URL (/embed/slug)
        - HTML Block (downloaded & uploaded)
        - Native API (recipe)
        - Not applicable
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug
      placeholder: When I set theme=dark on the pomodoro timer, the progress ring stays light colored...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Numbered steps to reproduce the behavior
      placeholder: |
        1. Go to /embed/pomodoro-timer?theme=dark
        2. Observe the progress ring color
        3. Compare with theme=light
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: The progress ring should use the accent color with dark mode contrast...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: The progress ring stays the light theme color...
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/GIFs
      description: Drag & drop or paste screenshots here
      placeholder: (attach screenshots)
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Notion plan, etc.
      placeholder: Chrome 128, macOS 15, Notion Free plan
    validations:
      required: false
  - type: checkboxes
    id: contract-check
    attributes:
      label: Widget Contract Check (widgets only)
      options:
        - label: Rule 1: Zero external requests (no CDN, webfonts, fetch, @import)
        - label: Rule 2: Two config sources (bk-config + URLSearchParams)
        - label: Rule 3: theme & accent params implemented
        - label: Rule 4: Namespaced state with try/catch (if persistsLocally)
        - label: Single scrollbar (body overflow:hidden + .wrap)
        - label: Reduced motion support
        - label: Clipboard fallback with console.log
        - label: System fonts only