<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Eisenhower Matrix</title>
<style>
:root{--bg:#ffffff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#2383e2;
--do:#e03e3e;--sched:#2383e2;--dele:#dfab01;--drop:#0f7b6c;
--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#2f2f2f;
--do:#ff7369;--sched:#529cca;--dele:#ffd60a;--drop:#4dab9a}
@media (prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#2f2f2f;
--do:#ff7369;--sched:#529cca;--dele:#ffd60a;--drop:#4dab9a}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased}
.wrap{height:100%;display:flex;flex-direction:column;gap:8px;padding:11px 13px;overflow:hidden}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input[type=text]{flex:1 1 160px;min-width:120px;font:inherit;font-size:12.5px;padding:5px 9px;border:1px solid var(--border);
border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in oklab,var(--accent) 18%,transparent)}
button{font:inherit;font-size:11.5px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{color:var(--fg)}
.matrix{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:7px}
.q{border:1px solid var(--border);border-radius:11px;background:var(--surface);display:flex;flex-direction:column;min-height:0;overflow:hidden;transition:.12s}
.q.over{border-color:var(--qcolor);background:color-mix(in oklab,var(--qcolor) 8%,var(--surface))}
.qh{display:flex;align-items:center;gap:6px;padding:7px 9px 5px}
.qh .dot{width:7px;height:7px;border-radius:50%;background:var(--qcolor);flex:0 0 auto}
.qh b{font-size:11.5px;font-weight:650;letter-spacing:-.005em}
.qh span{font-size:10px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.qsub{font-size:9.5px;color:var(--muted);padding:0 9px 5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.items{flex:1;min-height:0;overflow:auto;padding:0 6px 6px;display:flex;flex-direction:column;gap:4px}
.it{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:7px;
padding:4px 6px;cursor:grab;font-size:12px;line-height:1.3}
.it:active{cursor:grabbing}
.it.dragging{opacity:.4}
.it .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .x{color:var(--muted);opacity:0;cursor:pointer;font-size:13px;line-height:1;padding:0 2px}
.it:hover .x{opacity:1}
.it .grip{color:var(--muted);opacity:.5;font-size:10px;letter-spacing:-1px}
.empty{color:var(--muted);font-size:11px;text-align:center;padding:12px 6px;opacity:.7}
.foot{display:flex;gap:6px;justify-content:flex-end;font-size:10.5px;color:var(--muted);align-items:center}
@media (max-width:420px){.qh b{font-size:11px}.qsub{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <input type="text" id="add" placeholder="Add a task and press Enter…" />
    <button id="copy">Copy as to-dos</button>
    <button id="reset">Reset</button>
  </div>
  <div class="matrix" id="matrix"></div>
  <div class="foot"><span id="hint">Drag tasks between quadrants · double-click a task to move it</span></div>
</div>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};
  try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];
  q.forEach(function(v,k){c[k]=v;});

  var ACCENT=c.accent||'#2383e2';
  if(c.theme)document.documentElement.setAttribute('data-theme',c.theme);
  document.documentElement.style.setProperty('--accent',ACCENT);

  var QUADS=[
    {id:'do',name:'Do',sub:'Urgent · Important',color:'var(--do)'},
    {id:'sched',name:'Schedule',sub:'Not urgent · Important',color:'var(--sched)'},
    {id:'dele',name:'Delegate',sub:'Urgent · Not important',color:'var(--dele)'},
    {id:'drop',name:'Delete',sub:'Not urgent · Not important',color:'var(--drop)'}
  ];
  var KEY='blocksmith.eisenhower.v1';
  var DEFAULT={do:['Ship the proposal'],sched:['Draft Q4 roadmap','Read 20 pages'],dele:['Reply to status emails'],drop:[]};
  var state=DEFAULT;
  try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')state=s;}catch(e){}
  if(c.seed){
    try{
      var seeded=decodeURIComponent(String(c.seed));
      var parsed=JSON.parse(seeded);
      if(parsed&&typeof parsed==='object'){state={do:[],sched:[],dele:[],drop:[]};
        Object.keys(parsed).forEach(function(k){if(state[k])state[k]=Array.isArray(parsed[k])?parsed[k].map(String):[];});}
    }catch(e){}
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

  var host=document.getElementById('matrix');
  var dragId=null;

  function render(){
    host.innerHTML='';
    QUADS.forEach(function(Q){
      var list=state[Q.id]||[];
      var el=document.createElement('div');
      el.className='q';el.style.setProperty('--qcolor',Q.color);el.dataset.q=Q.id;
      el.innerHTML='<div class="qh"><span class="dot"></span><b>'+Q.name+'</b><span>'+list.length+'</span></div>'+
        '<div class="qsub">'+Q.sub+'</div>'+
        '<div class="items">'+(list.length?list.map(function(t,i){
          return '<div class="it" draggable="true" data-i="'+i+'"><span class="grip">⠿</span><span class="txt">'+String(t).replace(/[<>&]/g,'')+'</span><span class="x" title="Remove">×</span></div>';
        }).join(''):'<div class="empty">Drop tasks here</div>')+'</div>';
      host.appendChild(el);
      var items=el.querySelector('.items');
      el.addEventListener('dragover',function(e){e.preventDefault();el.classList.add('over');});
      el.addEventListener('dragleave',function(){el.classList.remove('over');});
      el.addEventListener('drop',function(e){
        e.preventDefault();el.classList.remove('over');
        if(dragId===null)return;
        var from=dragId.from,idx=dragId.idx;
        if(from===Q.id)return;
        var moved=(state[from]||[]).splice(idx,1)[0];
        if(moved===undefined)return;
        state[Q.id]=state[Q.id]||[];state[Q.id].push(moved);
        dragId=null;save();render();
      });
      items.querySelectorAll('.it').forEach(function(node){
        var idx=parseInt(node.dataset.i,10);
        node.addEventListener('dragstart',function(e){dragId={from:Q.id,idx:idx};node.classList.add('dragging');try{e.dataTransfer.setData('text/plain',String(idx));e.dataTransfer.effectAllowed='move';}catch(err){}});
        node.addEventListener('dragend',function(){node.classList.remove('dragging');dragId=null;});
        node.querySelector('.x').addEventListener('click',function(e){e.stopPropagation();(state[Q.id]||[]).splice(idx,1);save();render();});
        node.addEventListener('dblclick',function(){
          var order=QUADS.map(function(x){return x.id;});
          var nx=order[(order.indexOf(Q.id)+1)%order.length];
          var moved=(state[Q.id]||[]).splice(idx,1)[0];
          if(moved===undefined)return;
          state[nx]=state[nx]||[];state[nx].push(moved);save();render();
        });
      });
    });
    var hint=document.getElementById('hint');
    var del=(state.drop||[]).length;
    hint.textContent=del===0?'Nothing in Delete yet — if the matrix has no noise, look again':'Double-click a task to cycle it to the next quadrant';
  }

  var input=document.getElementById('add');
  input.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    var v=input.value.trim();if(!v)return;
    state.do=state.do||[];state.do.unshift(v);input.value='';save();render();
  });
  document.getElementById('reset').addEventListener('click',function(){
    if(!confirm('Clear every task in the matrix?'))return;
    state={do:[],sched:[],dele:[],drop:[]};save();render();
  });
  document.getElementById('copy').addEventListener('click',function(e){
    var b=e.currentTarget,lines=[];
    QUADS.forEach(function(Q){
      var l=state[Q.id]||[];if(!l.length)return;
      lines.push('**'+Q.name+'**');
      l.forEach(function(t){lines.push('- [ ] '+t);});
      lines.push('');
    });
    var txt=lines.join('\n').trim();
    function done(t){b.textContent=t;setTimeout(function(){b.textContent='Copy as to-dos';},1400);}
    try{navigator.clipboard.writeText(txt).then(function(){done('Copied ✓');},function(){done('See console');});}catch(err){done('See console');}
    try{console.log(txt);}catch(err){}
  });
  render();
})();
</script>
</body>
</html>
