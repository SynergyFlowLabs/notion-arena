<!doctype html>
<html lang="en" data-theme="auto">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Character and Setting Bible</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#6b6a68;--surface:#f7f7f5;--border:#e9e9e7;--accent:#9065b0;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{overflow:hidden;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrap{height:100%;min-height:280px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{margin-top:2px;font-size:14px;font-weight:650}.count{text-align:right;color:var(--muted);font-size:9px}.count b{display:block;color:var(--accent-text);font-size:12px}.form{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:5px}.form input,.form select,.form textarea,.search{width:100%;min-width:0;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:5px 7px;font:inherit;font-size:9px}.form input,.form select{height:30px}.form textarea{grid-column:1/3;min-height:42px;resize:vertical;line-height:1.35}.form input:focus-visible,.form select:focus-visible,.form textarea:focus-visible,.search:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form button{grid-column:3;grid-row:2;height:29px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 8px;cursor:pointer}.search{height:29px}.list{display:flex;flex:1;min-height:50px;flex-direction:column;gap:5px;overflow:auto}.entry{display:grid;grid-template-columns:auto minmax(0,1fr) 22px;align-items:start;gap:4px 7px;padding:7px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.kind{padding:2px 6px;border:1px solid var(--border);border-radius:10px;color:var(--accent-text);font-size:8px;white-space:nowrap}.name{min-width:0;overflow-wrap:anywhere;font-size:9.5px;font-weight:650}.description{grid-column:1/3;overflow-wrap:anywhere;color:var(--muted);font-size:9px;line-height:1.4}.remove{grid-column:3;grid-row:1/3;width:21px;height:21px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.empty{text-align:center;padding:12px;color:var(--muted);font-size:10px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.msg,.warning{color:var(--muted);font-size:9px;line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}@media(max-width:350px){.wrap{padding:10px}.form{grid-template-columns:88px minmax(0,1fr)}.form textarea{grid-column:1/3}.form button{grid-column:2;grid-row:auto}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head>
<body><main class="wrap"><header class="head"><div><div class="kicker">Keep fictional details together</div><div class="title" id="title">Character bible</div></div><div class="count"><b id="count">0</b>entries</div></header>
<form class="form" id="form"><label class="sr-only" for="kind">Entry type</label><select id="kind"><option>Character</option><option>Setting</option><option>Object</option><option>Other</option></select><label class="sr-only" for="name">Name</label><input id="name" maxlength="56" placeholder="Name" required /><label class="sr-only" for="description">Details</label><textarea id="description" maxlength="420" placeholder="Traits, role, history, or details"></textarea><button type="submit">Add entry</button></form>
<label class="sr-only" for="search">Search entries</label><input class="search" id="search" type="search" maxlength="60" placeholder="Search your notes" /><section class="list" id="list" aria-label="Character and setting notes"></section><footer class="foot"><span class="msg" id="msg" aria-live="polite">Notes stay in this browser, not encrypted or synced.</span><button class="clear" id="clear" type="button">Clear notes</button></footer><div class="warning">Avoid real personal or confidential information in this local writing aid.</div></main>
<script>
(function(){var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(h){var s=h.slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function contrast(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function ink(h){var a=rgb(h);return contrast(a,[255,255,255])>=contrast(a,[0,0,0])?'#fff':'#000';}function textColor(h){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(h),to=dark?[255,255,255]:[0,0,0];if(contrast(a,bg)>=4.5)return h;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(contrast(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>=0?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#9065b0'),LABEL=String(c.label||'Character bible').slice(0,48),KEY='notion-arena.character-bible.v1',items=[];function setText(){document.documentElement.style.setProperty('--accent-text',textColor(ACCENT));}document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',ink(ACCENT));setText();if(theme==='auto'&&window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',setText);else if(mq.addListener)mq.addListener(setText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))items=a.filter(function(x){return x&&typeof x.name==='string';}).slice(0,120);}catch(e){}var list=document.getElementById('list'),msg=document.getElementById('msg'),search=document.getElementById('search');function save(text){try{localStorage.setItem(KEY,JSON.stringify(items));msg.textContent=text||'Notes stay in this browser, not encrypted or synced.';}catch(e){msg.textContent='Storage is unavailable in this browser session.';}}function render(){list.textContent='';document.getElementById('count').textContent=String(items.length);var needle=search.value.trim().toLocaleLowerCase(),shown=items.filter(function(x){return !needle||(x.name+' '+x.kind+' '+(x.description||'')).toLocaleLowerCase().includes(needle);});if(!shown.length){var empty=document.createElement('div');empty.className='empty';empty.textContent=items.length?'No notes match that search.':'Add a character, setting, or object to start.';list.appendChild(empty);return;}shown.forEach(function(item){var row=document.createElement('article');row.className='entry';var kind=document.createElement('span');kind.className='kind';kind.textContent=item.kind||'Other';var name=document.createElement('span');name.className='name';name.textContent=item.name;var desc=document.createElement('div');desc.className='description';desc.textContent=item.description||'No details added';var del=document.createElement('button');del.className='remove';del.type='button';del.textContent='×';del.setAttribute('aria-label','Remove '+item.kind+': '+item.name);del.addEventListener('click',function(){items.splice(items.indexOf(item),1);save();render();});row.append(kind,name,desc,del);list.appendChild(row);});}search.addEventListener('input',render);document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var kind=document.getElementById('kind').value,name=document.getElementById('name').value.trim().slice(0,56),description=document.getElementById('description').value.trim().slice(0,420);if(!name)return;if(items.length>=120){msg.textContent='Entry limit reached.';return;}items.push({kind:kind,name:name,description:description});document.getElementById('name').value='';document.getElementById('description').value='';save();render();document.getElementById('name').focus();});document.getElementById('clear').addEventListener('click',function(){items=[];save('Writing notes cleared.');render();});render();})();
</script></body></html>
