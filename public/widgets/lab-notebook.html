<!doctype html>
<html lang="en" data-theme="auto">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Lab Notebook</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#6b6a68;--surface:#f7f7f5;--border:#e9e9e7;--accent:#0f7b6c;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{overflow:hidden;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrap{height:100%;min-height:290px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{margin-top:2px;font-size:14px;font-weight:650}.count{text-align:right;color:var(--muted);font-size:9px}.count b{display:block;color:var(--accent-text);font-size:12px}.form{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:5px}.form input,.form textarea{width:100%;min-width:0;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:5px 7px;font:inherit;font-size:9px}.form input{height:30px}.form textarea{min-height:42px;resize:vertical;line-height:1.35}.form .long{grid-column:1/3}.form input:focus-visible,.form textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form button{grid-column:2;height:29px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 8px;cursor:pointer}.list{display:flex;flex:1;min-height:55px;flex-direction:column;gap:5px;overflow:auto}.entry{padding:7px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.entry-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.name{min-width:0;overflow-wrap:anywhere;font-size:10px;font-weight:650}.date{color:var(--accent-text);font-size:8.5px;white-space:nowrap}.label{margin-top:5px;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.06em}.text{overflow-wrap:anywhere;white-space:pre-wrap;font-size:9px;line-height:1.4}.remove{float:right;width:22px;height:22px;margin:4px 0 0 7px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.empty{text-align:center;padding:12px;color:var(--muted);font-size:10px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.msg,.warning{color:var(--muted);font-size:9px;line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}@media(max-width:340px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 96px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head>
<body><main class="wrap"><header class="head"><div><div class="kicker">Manual observations</div><div class="title" id="title">Lab notebook</div></div><div class="count"><b id="count">0</b>entries</div></header>
<form class="form" id="form"><label class="sr-only" for="experiment">Experiment or project</label><input id="experiment" maxlength="64" placeholder="Experiment or project" required /><label class="sr-only" for="date">Entry date</label><input id="date" type="date" required /><label class="sr-only" for="question">Question or hypothesis</label><textarea class="long" id="question" maxlength="420" placeholder="Question or hypothesis"></textarea><label class="sr-only" for="observation">Observation or result</label><textarea class="long" id="observation" maxlength="800" placeholder="Observation or result" required></textarea><button type="submit">Add entry</button></form>
<section class="list" id="list" aria-label="Lab notebook entries"></section><footer class="foot"><span class="msg" id="msg" aria-live="polite">Entries stay in this browser and are not encrypted.</span><button class="clear" id="clear" type="button">Clear notebook</button></footer><div class="warning">Personal notes only, not a verified, regulated, or safety-controlled research record.</div></main>
<script>
(function(){var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(h){var s=h.slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function contrast(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function ink(h){var a=rgb(h);return contrast(a,[255,255,255])>=contrast(a,[0,0,0])?'#fff':'#000';}function textColor(h){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(h),to=dark?[255,255,255]:[0,0,0];if(contrast(a,bg)>=4.5)return h;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(contrast(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>=0?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#0f7b6c'),LABEL=String(c.label||'Lab notebook').slice(0,48),KEY='blocksmith.lab-notebook.v1',items=[];function setText(){document.documentElement.style.setProperty('--accent-text',textColor(ACCENT));}document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',ink(ACCENT));setText();if(theme==='auto'&&window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',setText);else if(mq.addListener)mq.addListener(setText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;function dateKey(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}document.getElementById('date').value=dateKey();try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))items=a.filter(function(x){return x&&typeof x.experiment==='string'&&typeof x.observation==='string';}).slice(0,80);}catch(e){}var list=document.getElementById('list'),msg=document.getElementById('msg');function save(text){try{localStorage.setItem(KEY,JSON.stringify(items));msg.textContent=text||'Entries stay in this browser and are not encrypted.';}catch(e){msg.textContent='Storage is unavailable in this browser session.';}}function render(){list.textContent='';document.getElementById('count').textContent=String(items.length);if(!items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Add an observation to start your notebook.';list.appendChild(empty);return;}items.slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));}).forEach(function(item){var row=document.createElement('article');row.className='entry';var head=document.createElement('div');head.className='entry-head';var name=document.createElement('span');name.className='name';name.textContent=item.experiment;var date=document.createElement('span');date.className='date';date.textContent=item.date||'';head.append(name,date);var label1=document.createElement('div');label1.className='label';label1.textContent='Question or hypothesis';var q=document.createElement('div');q.className='text';q.textContent=item.question||'Not recorded';var label2=document.createElement('div');label2.className='label';label2.textContent='Observation';var obs=document.createElement('div');obs.className='text';obs.textContent=item.observation;var del=document.createElement('button');del.className='remove';del.type='button';del.textContent='×';del.setAttribute('aria-label','Remove notebook entry: '+item.experiment);del.addEventListener('click',function(){items.splice(items.indexOf(item),1);save();render();});row.append(head,label1,q,label2,obs,del);list.appendChild(row);});}document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var experiment=document.getElementById('experiment').value.trim().slice(0,64),question=document.getElementById('question').value.trim().slice(0,420),observation=document.getElementById('observation').value.trim().slice(0,800),date=document.getElementById('date').value;if(!experiment||!observation||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;if(items.length>=80){msg.textContent='Notebook limit reached.';return;}items.push({experiment:experiment,question:question,observation:observation,date:date});document.getElementById('experiment').value='';document.getElementById('question').value='';document.getElementById('observation').value='';save();render();document.getElementById('experiment').focus();});document.getElementById('clear').addEventListener('click',function(){items=[];save('Lab notebook cleared.');render();});render();})();
</script></body></html>
