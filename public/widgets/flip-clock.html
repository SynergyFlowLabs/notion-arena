<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flip Clock</title>
<style>
:root{--bg:#ffffff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#2383e2;--card:#fbfbfa;
--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#2f2f2f;--card:#202020}
@media (prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#2f2f2f;--card:#202020}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
.clock{display:flex;align-items:center;gap:6px}
.card{position:relative;min-width:56px;height:74px;border-radius:9px;background:var(--card);border:1px solid var(--border);
box-shadow:0 1px 2px rgba(15,15,15,.05);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:color-mix(in oklab,var(--fg) 10%,transparent)}
.card b{font-size:38px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.card.flip b{animation:flip .28s ease-out}
@keyframes flip{0%{transform:rotateX(0);opacity:1}45%{transform:rotateX(-72deg);opacity:.35}100%{transform:rotateX(0);opacity:1}}
.colon{font-size:30px;font-weight:600;color:var(--muted);opacity:.7;transform:translateY(-2px)}
.meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.date{font-weight:500}
.tz{padding:2px 8px;border:1px solid var(--border);border-radius:99px;background:var(--surface);font-size:11px;font-weight:600;letter-spacing:.02em}
.suffix{font-size:14px;font-weight:600;color:var(--accent);align-self:flex-start;margin-top:14px}
.ampm{display:flex}
@media (max-width:400px){.card{min-width:44px;height:60px}.card b{font-size:29px}.colon{font-size:23px}}
@media (prefers-reduced-motion:reduce){.card.flip b{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="clock" id="clock">
    <div class="card" id="h1"><b>0</b></div>
    <div class="card" id="h2"><b>0</b></div>
    <div class="colon" id="c1">:</div>
    <div class="card" id="m1"><b>0</b></div>
    <div class="card" id="m2"><b>0</b></div>
    <div class="colon" id="c2" style="display:none">:</div>
    <div class="card" id="s1" style="display:none"><b>0</b></div>
    <div class="card" id="s2" style="display:none"><b>0</b></div>
    <div class="suffix" id="suffix" style="display:none">AM</div>
  </div>
  <div class="meta">
    <span class="date" id="date"></span>
    <span class="tz" id="tz" style="display:none"></span>
  </div>
</div>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};
  try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];
  q.forEach(function(v,k){c[k]=v;});
  function bool(k,d){var v=c[k];return v===undefined?d:(v===true||v==='true'||v==='1');}

  var ACCENT=c.accent||'#2383e2';
  if(c.theme)document.documentElement.setAttribute('data-theme',c.theme);
  document.documentElement.style.setProperty('--accent',ACCENT);

  var H24=bool('h24',false), SHOWDATE=bool('date',true), SHOWSEC=bool('seconds',false);
  var TZ=(c.tz||'').trim();
  var fmtOpts={hour:'2-digit',minute:'2-digit',hour12:!H24};
  if(SHOWSEC)fmtOpts.second='2-digit';
  var dateOpts={weekday:'long',month:'long',day:'numeric',year:'numeric'};
  var locale=navigator.language||'en-US';
  if(TZ){fmtOpts.timeZone=TZ;dateOpts.timeZone=TZ;
    var tzEl=document.getElementById('tz');tzEl.style.display='';tzEl.textContent=TZ.split('/').pop().replace(/_/g,' ');}
  if(!SHOWDATE)document.querySelector('.meta').style.display='none';
  if(SHOWSEC){['c2','s1','s2'].forEach(function(i){document.getElementById(i).style.display='';});}

  var ids=['h1','h2','m1','m2','s1','s2'];
  var els={};ids.forEach(function(i){els[i]=document.getElementById(i);});
  var suffix=document.getElementById('suffix');
  if(!H24)suffix.style.display='';
  var last='';

  function setCard(id,ch){
    var el=els[id],b=el.firstElementChild;
    if(b.textContent!==ch){b.textContent=ch;el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip');}
  }
  function paint(){
    var now=new Date();
    var parts;
    try{parts=new Intl.DateTimeFormat(locale,fmtOpts).formatToParts(now);}
    catch(e){parts=new Intl.DateTimeFormat('en-US',fmtOpts).formatToParts(now);}
    var get=function(t){for(var i=0;i<parts.length;i++)if(parts[i].type===t)return parts[i].value;return '';};
    var h=get('hour'),m=get('minute'),s=get('second')||'00',dp=get('dayPeriod');
    if(h.length<2)h='0'+h;
    if(!H24&&dp)suffix.textContent=dp.toUpperCase();
    var sig=h+m+(SHOWSEC?s:'');
    if(sig===last)return;
    var changed=last!=='';
    last=sig;
    setCard('h1',h[0]);setCard('h2',h[1]);setCard('m1',m[0]);setCard('m2',m[1]);
    if(SHOWSEC){setCard('s1',s[0]);setCard('s2',s[1]);}
    if(changed){
      try{document.getElementById('date').textContent=new Intl.DateTimeFormat(locale,dateOpts).format(now);}catch(e){}
    }
  }
  try{document.getElementById('date').textContent=new Intl.DateTimeFormat(locale,dateOpts).format(new Date());}catch(e){}
  paint();setInterval(paint,250);
})();
</script>
</body>
</html>
