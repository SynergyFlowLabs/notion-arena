<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Local Request Form</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#2383e2;--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{height:100%;min-height:290px;display:flex;flex-direction:column;gap:9px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:13.5px;font-weight:650;margin-top:2px}.privacy{font-size:9px;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:7px}.field{display:flex;min-width:0;flex-direction:column;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:10px;font-weight:600;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:6px 7px;font:inherit;font-size:11px}.field input,.field select{height:31px}.field textarea{min-height:64px;resize:vertical;line-height:1.4}.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
button{min-height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:10.5px;font-weight:550;padding:5px 9px;cursor:pointer}button:hover{border-color:color-mix(in oklab,var(--accent) 45%,var(--border))}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.primary{border-color:var(--accent);background:var(--accent);color:#fff}.result{display:flex;flex:1;min-height:0;flex-direction:column;gap:7px}.result-title{font-size:11px;font-weight:650}.payload{min-height:95px;flex:1;width:100%;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:8px;font:10px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}.payload:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.status{min-height:14px;font-size:10px;color:var(--muted)}
@media(max-width:350px){.wrap{padding:10px}.form{gap:5px}.field input,.field select,.field textarea{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Private by default</div><div class="title" id="title">Quick request</div></div><div class="privacy">Nothing is sent</div></header>
  <form class="form" id="form">
    <div class="field"><label for="name">Your name</label><input id="name" name="name" maxlength="80" autocomplete="name" required /></div>
    <div class="field"><label id="emailLabel" for="email">Email, optional</label><input id="email" name="email" type="email" maxlength="120" autocomplete="email" /></div>
    <div class="field full"><label for="topic">Request type</label><select id="topic" name="topic"><option>Question</option><option>Support</option><option>Feedback</option><option>Other</option></select></div>
    <div class="field full"><label for="details">Details</label><textarea id="details" name="details" maxlength="1200" required></textarea></div>
    <div class="field full actions"><button class="primary" type="submit">Prepare request</button><span class="privacy">Copy it yourself, this form has no receiver.</span></div>
  </form>
  <section class="result" id="result" hidden aria-label="Prepared request">
    <div class="result-title">Copy or keep this JSON locally</div>
    <textarea class="payload" id="payload" readonly aria-label="Prepared request JSON"></textarea>
    <div class="actions"><button class="primary" id="copy" type="button">Copy request</button><button id="edit" type="button">Edit</button></div>
  </section>
  <div class="status" id="status" aria-live="polite">Your entries are not sent or saved by this widget.</div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function bool(k,d){var v=c[k];return v===undefined?d:(v===true||v==='true'||v==='1');}
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>-1?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#2383e2'),LABEL=String(c.label||'Quick request').slice(0,48);
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.getElementById('title').textContent=LABEL;document.title=LABEL;
  var form=document.getElementById('form'),email=document.getElementById('email'),result=document.getElementById('result'),payload=document.getElementById('payload'),status=document.getElementById('status');
  email.required=bool('requireEmail',false);document.getElementById('emailLabel').textContent=email.required?'Email':'Email, optional';
  form.addEventListener('submit',function(e){e.preventDefault();if(!form.reportValidity())return;var data={topic:document.getElementById('topic').value,name:document.getElementById('name').value.trim(),email:email.value.trim(),details:document.getElementById('details').value.trim(),preparedAt:new Date().toISOString()};payload.value=JSON.stringify(data,null,2);form.hidden=true;result.hidden=false;status.textContent='Request prepared. Nothing was sent or saved.';});
  function manualCopy(){payload.focus();payload.select();status.textContent='Request selected. Use your device copy command; nothing was sent.';}
  document.getElementById('copy').addEventListener('click',function(){try{if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(payload.value).then(function(){status.textContent='Copied. Nothing was sent.';},manualCopy);}else manualCopy();}catch(e){manualCopy();}});
  document.getElementById('edit').addEventListener('click',function(){result.hidden=true;form.hidden=false;status.textContent='Edit your request. Entries remain only in this page until you leave.';});
})();
</script>
</body>
</html>
