<!doctype html>
<html lang="en" data-theme="auto">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Submission Tracker</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#6b6a68;--surface:#f7f7f5;--border:#e9e9e7;--accent:#2383e2;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{overflow:hidden;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrap{height:100%;min-height:270px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{margin-top:2px;font-size:14px;font-weight:650}.summary{text-align:right;color:var(--muted);font-size:9px}.summary b{display:block;color:var(--accent-text);font-size:12px}.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr) 105px 100px auto;gap:5px}.form input,.form select{width:100%;min-width:0;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 6px;font:inherit;font-size:8.5px}.form input:focus-visible,.form select:focus-visible,.row select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form button{height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}.list{display:flex;flex:1;min-height:55px;flex-direction:column;gap:4px;overflow:auto}.row{display:grid;grid-template-columns:minmax(0,1fr) 105px 95px 22px;align-items:center;gap:5px;padding:6px 7px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.work{min-width:0;overflow-wrap:anywhere;font-size:9.5px;font-weight:650}.outlet{display:block;margin-top:2px;color:var(--muted);font-size:8px;font-weight:400}.date{color:var(--accent-text);font-size:8px;white-space:nowrap}.row select{width:100%;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-size:8px;padding:2px}.remove{width:21px;height:21px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.empty{text-align:center;padding:12px;color:var(--muted);font-size:10px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.msg,.note{color:var(--muted);font-size:9px;line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}@media(max-width:430px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 95px 100px}.form input:first-of-type{grid-column:1/4}.form button{grid-column:3}.row{grid-template-columns:minmax(0,1fr) 85px 78px 21px;gap:4px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head>
<body><main class="wrap"><header class="head"><div><div class="kicker">Manual submission log</div><div class="title" id="title">Submission tracker</div></div><div class="summary"><b id="active">0</b>in progress</div></header>
<form class="form" id="form"><label class="sr-only" for="work">Work title</label><input id="work" maxlength="64" placeholder="Work or project" required /><label class="sr-only" for="outlet">Publication or recipient</label><input id="outlet" maxlength="44" placeholder="Publication / recipient" /><label class="sr-only" for="date">Submission date</label><input id="date" type="date" /><label class="sr-only" for="state">Status</label><select id="state"><option>Draft</option><option>Submitted</option><option>Under review</option><option>Accepted</option><option>Declined</option><option>Withdrawn</option></select><button type="submit">Add</button></form>
<section class="list" id="list" aria-label="Submissions"></section><footer class="foot"><span class="msg" id="msg" aria-live="polite">Entries stay in this browser. Nothing is sent.</span><button class="clear" id="clear" type="button">Clear log</button></footer><div class="note">Local status notes are not encrypted. Nothing is submitted or predicted.</div></main>
<script>
(function(){var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(h){var s=h.slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function contrast(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function ink(h){var a=rgb(h);return contrast(a,[255,255,255])>=contrast(a,[0,0,0])?'#fff':'#000';}function textColor(h){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(h),to=dark?[255,255,255]:[0,0,0];if(contrast(a,bg)>=4.5)return h;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(contrast(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>=0?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#2383e2'),LABEL=String(c.label||'Submission tracker').slice(0,48),KEY='blocksmith.submission-tracker.v1',states=['Draft','Submitted','Under review','Accepted','Declined','Withdrawn'],items=[];function setText(){document.documentElement.style.setProperty('--accent-text',textColor(ACCENT));}document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',ink(ACCENT));setText();if(theme==='auto'&&window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',setText);else if(mq.addListener)mq.addListener(setText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))items=a.filter(function(x){return x&&typeof x.work==='string';}).slice(0,100);}catch(e){}var list=document.getElementById('list'),msg=document.getElementById('msg');function save(text){try{localStorage.setItem(KEY,JSON.stringify(items));msg.textContent=text||'Entries stay in this browser. Nothing is sent.';}catch(e){msg.textContent='Storage is unavailable in this browser session.';}}function fmt(v){if(!v)return'Date not set';var d=new Date(v+'T00:00:00');return isNaN(d.getTime())?v:new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(d);}function render(){list.textContent='';document.getElementById('active').textContent=String(items.filter(function(x){return !['Accepted','Declined','Withdrawn'].includes(x.state);}).length);if(!items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Log a draft or sent work to keep a manual record.';list.appendChild(empty);return;}items.slice().reverse().forEach(function(item){var row=document.createElement('div');row.className='row';var name=document.createElement('span');name.className='work';name.textContent=item.work;var outlet=document.createElement('span');outlet.className='outlet';outlet.textContent=item.outlet||'Recipient not noted';name.appendChild(outlet);var date=document.createElement('span');date.className='date';date.textContent=fmt(item.date);var select=document.createElement('select');select.setAttribute('aria-label','Status for '+item.work);states.forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;select.appendChild(o);});select.value=states.indexOf(item.state)>=0?item.state:'Draft';select.addEventListener('change',function(){item.state=select.value;save();render();});var del=document.createElement('button');del.className='remove';del.type='button';del.textContent='×';del.setAttribute('aria-label','Remove submission: '+item.work);del.addEventListener('click',function(){items.splice(items.indexOf(item),1);save();render();});row.append(name,date,select,del);list.appendChild(row);});}document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var work=document.getElementById('work').value.trim().slice(0,64),outlet=document.getElementById('outlet').value.trim().slice(0,44),date=document.getElementById('date').value,state=document.getElementById('state').value;if(!work)return;if(items.length>=100){msg.textContent='Submission log limit reached.';return;}items.push({work:work,outlet:outlet,date:date,state:state});document.getElementById('work').value='';document.getElementById('outlet').value='';document.getElementById('date').value='';document.getElementById('state').value='Draft';save();render();document.getElementById('work').focus();});document.getElementById('clear').addEventListener('click',function(){items=[];save('Submission log cleared.');render();});render();})();
</script></body></html>
