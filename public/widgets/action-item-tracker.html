<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Action Item Tracker</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#6b6a68;--surface:#f7f7f5;--border:#e9e9e7;--accent:#0f7b6c;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}.wrap{height:100%;min-height:255px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:14px;font-weight:650;margin-top:2px}.summary{font-size:9px;color:var(--muted);text-align:right}.summary b{display:block;color:var(--accent-text);font-size:12px}.form{display:grid;grid-template-columns:minmax(0,1fr) 90px 108px auto;gap:5px}.form input{min-width:0;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 6px;font:inherit;font-size:9px}.form input:focus-visible,.row select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form button{height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 8px;cursor:pointer}.list{display:flex;min-height:60px;flex:1;flex-direction:column;gap:4px;overflow:auto}.row{display:grid;grid-template-columns:minmax(0,1fr) 82px 83px 22px;align-items:center;gap:5px;padding:5px 6px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.task{min-width:0;overflow-wrap:anywhere;font-size:9.5px;font-weight:600}.owner{display:block;margin-top:2px;color:var(--muted);font-size:8px;font-weight:400}.due{color:var(--accent-text);font-size:8.5px;white-space:nowrap}.row select{width:100%;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-size:8px;padding:2px}.remove{width:21px;height:21px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.empty{text-align:center;padding:12px;color:var(--muted);font-size:10px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.status,.note{font-size:9px;color:var(--muted);line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}@media(max-width:360px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 94px}.form button{grid-column:2}.row{grid-template-columns:minmax(0,1fr) 65px 72px 21px;gap:3px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Follow-up checklist</div><div class="title" id="title">Action items</div></div><div class="summary"><b id="open">0</b>open</div></header>
  <form class="form" id="form"><label class="sr-only" for="task">Action item</label><input id="task" maxlength="64" placeholder="Action item" required /><label class="sr-only" for="owner">Owner</label><input id="owner" maxlength="36" placeholder="Owner" /><label class="sr-only" for="due">Due date</label><input id="due" type="date" /><button type="submit">Add</button></form>
  <section class="list" id="list" aria-label="Action items"></section>
  <footer class="foot"><span class="status" id="status" aria-live="polite">Items save only in this browser. No team reminders.</span><button class="clear" id="clear" type="button">Clear done</button></footer>
  <div class="note">A personal follow-up list, not a shared task system or notification service.</div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(h){var s=String(h).slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function ratio(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function ink(h){var a=rgb(h);return ratio(a,[255,255,255])>=ratio(a,[0,0,0])?'#fff':'#000';}function textColor(h){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(h),to=dark?[255,255,255]:[0,0,0];if(ratio(a,bg)>=4.5)return h;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(ratio(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}function setText(){document.documentElement.style.setProperty('--accent-text',textColor(ACCENT));}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>=0?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#0f7b6c'),LABEL=String(c.label||'Action items').slice(0,48),KEY='notion-arena.action-item-tracker.v1',states=['Open','In progress','Done'],items=[];
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',ink(ACCENT));setText();if(theme==='auto'&&window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',setText);else if(mq.addListener)mq.addListener(setText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;
  try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))items=a.filter(function(x){return x&&typeof x.task==='string';}).slice(0,100);}catch(e){}
  var list=document.getElementById('list'),status=document.getElementById('status');function save(msg){try{localStorage.setItem(KEY,JSON.stringify(items));status.textContent=msg||'Items save only in this browser. No team reminders.';}catch(e){status.textContent='Storage is unavailable in this browser session.';}}function showDate(v){if(!v)return'No due date';var d=new Date(v+'T00:00:00');return isNaN(d.getTime())?v:new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(d);}
  function render(){list.textContent='';document.getElementById('open').textContent=String(items.filter(function(x){return x.state!=='Done';}).length);if(!items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Add a follow-up item to begin.';list.appendChild(empty);return;}items.slice().sort(function(a,b){if((a.state==='Done')!==(b.state==='Done'))return a.state==='Done'?1:-1;return(a.due||'9999').localeCompare(b.due||'9999');}).forEach(function(item){var index=items.indexOf(item),row=document.createElement('div');row.className='row';var task=document.createElement('span');task.className='task';task.textContent=item.task;var owner=document.createElement('span');owner.className='owner';owner.textContent=item.owner||'No owner set';task.appendChild(owner);var due=document.createElement('span');due.className='due';due.textContent=showDate(item.due);var select=document.createElement('select');select.setAttribute('aria-label','Status for '+item.task);states.forEach(function(x){var o=document.createElement('option');o.value=x;o.textContent=x;select.appendChild(o);});select.value=states.indexOf(item.state)>=0?item.state:'Open';select.addEventListener('change',function(){item.state=select.value;save();render();});var remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove action item: '+item.task);remove.addEventListener('click',function(){items.splice(index,1);save();render();});row.append(task,due,select,remove);list.appendChild(row);});}
  document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var task=document.getElementById('task').value.trim().slice(0,64),owner=document.getElementById('owner').value.trim().slice(0,36),due=document.getElementById('due').value;if(!task)return;if(items.length>=100){status.textContent='Action list limit reached.';return;}items.push({task:task,owner:owner,due:due,state:'Open'});document.getElementById('task').value='';document.getElementById('owner').value='';document.getElementById('due').value='';save();render();document.getElementById('task').focus();});document.getElementById('clear').addEventListener('click',function(){items=items.filter(function(x){return x.state!=='Done';});save('Completed action items cleared.');render();});render();
})();
</script>
</body>
</html>
