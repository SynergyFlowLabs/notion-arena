<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Exam Planner</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#6b6a68;--surface:#f7f7f5;--border:#e9e9e7;--accent:#6940a5;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}.wrap{height:100%;min-height:250px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:14px;font-weight:650;margin-top:2px}.summary{font-size:9px;color:var(--muted);text-align:right}.summary b{display:block;color:var(--accent-text);font-size:12px}.form{display:grid;grid-template-columns:minmax(0,1fr) 120px 102px auto;gap:5px}.form input{min-width:0;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 6px;font:inherit;font-size:9.5px}.form input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form button{height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 8px;cursor:pointer}.list{display:flex;min-height:60px;flex:1;flex-direction:column;gap:4px;overflow:auto}.row{display:grid;grid-template-columns:minmax(0,1fr) auto 23px;align-items:center;gap:3px 7px;padding:6px 7px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.subject{min-width:0;overflow-wrap:anywhere;font-size:10px;font-weight:600}.location{display:block;margin-top:2px;color:var(--muted);font-size:8.5px;font-weight:400}.days{color:var(--accent-text);font-size:9px;font-weight:650;text-align:right;white-space:nowrap}.date{grid-column:1/3;color:var(--muted);font-size:8.5px}.remove{grid-column:3;grid-row:1/3;width:22px;height:22px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.empty{text-align:center;padding:12px;color:var(--muted);font-size:10px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.status,.note{font-size:9px;color:var(--muted);line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}@media(max-width:360px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 110px}.form button{grid-column:2}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Upcoming assessments</div><div class="title" id="title">Exam planner</div></div><div class="summary"><b id="upcoming">0</b>planned</div></header>
  <form class="form" id="form"><label class="sr-only" for="subject">Exam or course</label><input id="subject" maxlength="56" placeholder="Exam or course" required /><label class="sr-only" for="date">Exam date</label><input id="date" type="date" required /><label class="sr-only" for="place">Room (optional)</label><input id="place" maxlength="36" placeholder="Room (optional)" /><button type="submit">Add</button></form>
  <section class="list" id="list" aria-label="Planned exams"></section>
  <footer class="foot"><span class="status" id="status" aria-live="polite">Exam dates save only in this browser.</span><button class="clear" id="clear" type="button">Clear past exams</button></footer>
  <div class="note">Countdowns use your device date. Verify changes against the official school schedule.</div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(h){var s=String(h).slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function ratio(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function ink(h){var a=rgb(h);return ratio(a,[255,255,255])>=ratio(a,[0,0,0])?'#fff':'#000';}function textColor(h){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(h),to=dark?[255,255,255]:[0,0,0];if(ratio(a,bg)>=4.5)return h;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(ratio(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}function setText(){document.documentElement.style.setProperty('--accent-text',textColor(ACCENT));}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>=0?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#6940a5'),LABEL=String(c.label||'Exam planner').slice(0,48),KEY='blocksmith.exam-planner.v1',items=[];
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',ink(ACCENT));setText();if(theme==='auto'&&window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',setText);else if(mq.addListener)mq.addListener(setText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;
  function key(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}var dateInput=document.getElementById('date');dateInput.value=key(new Date());try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))items=a.filter(function(x){return x&&typeof x.subject==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date);}).slice(0,80);}catch(e){}
  var list=document.getElementById('list'),status=document.getElementById('status');function save(msg){try{localStorage.setItem(KEY,JSON.stringify(items));status.textContent=msg||'Exam dates save only in this browser.';}catch(e){status.textContent='Storage is unavailable in this browser session.';}}function dayDiff(v){var d=new Date(v+'T00:00:00'),today=new Date();today.setHours(0,0,0,0);return Math.round((d.getTime()-today.getTime())/86400000);}function dateText(v){var d=new Date(v+'T00:00:00');return isNaN(d.getTime())?v:new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'}).format(d);}function countdown(v){var n=dayDiff(v);return n<0?'Past date':n===0?'Today':n===1?'Tomorrow':'In '+n+' days';}
  function render(){list.textContent='';var now=key(new Date());document.getElementById('upcoming').textContent=String(items.filter(function(x){return x.date>=now;}).length);if(!items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Add an exam date to see it here.';list.appendChild(empty);return;}items.slice().sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(item){var index=items.indexOf(item),row=document.createElement('div');row.className='row';var subject=document.createElement('span');subject.className='subject';subject.textContent=item.subject;var place=document.createElement('span');place.className='location';place.textContent=item.place||'Location not set';subject.appendChild(place);var days=document.createElement('span');days.className='days';days.textContent=countdown(item.date);var date=document.createElement('span');date.className='date';date.textContent=dateText(item.date);var remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove '+item.subject);remove.addEventListener('click',function(){items.splice(index,1);save();render();});row.append(subject,days,date,remove);list.appendChild(row);});}
  document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var subject=document.getElementById('subject').value.trim().slice(0,56),date=dateInput.value,place=document.getElementById('place').value.trim().slice(0,36);if(!subject||!/^\d{4}-\d{2}-\d{2}$/.test(date))return;if(items.length>=80){status.textContent='Exam limit reached.';return;}items.push({subject:subject,date:date,place:place});document.getElementById('subject').value='';document.getElementById('place').value='';dateInput.value=key(new Date());save();render();document.getElementById('subject').focus();});document.getElementById('clear').addEventListener('click',function(){var now=key(new Date());items=items.filter(function(x){return x.date>=now;});save('Past exams cleared.');render();});render();
})();
</script>
</body>
</html>
