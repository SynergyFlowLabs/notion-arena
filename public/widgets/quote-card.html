<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Daily Quote</title>
<style>
:root{--bg:#ffffff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#dfab01;
--serif:ui-serif,Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;
--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#2f2f2f}
@media (prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#2f2f2f}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;justify-content:center;padding:20px 24px;position:relative;gap:10px}
.mark{font-family:var(--serif);font-size:52px;line-height:.6;color:var(--accent);opacity:.55;height:22px}
.quote{font-family:var(--serif);font-size:19px;line-height:1.5;letter-spacing:-.005em;max-width:62ch}
.quote.sans{font-family:var(--font);font-size:17px;font-weight:500}
.by{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.by .rule{width:22px;height:1.5px;background:var(--accent);border-radius:2px;opacity:.7}
.by b{color:var(--fg);font-weight:600}
.day{position:absolute;top:14px;right:16px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.shuf{position:absolute;bottom:12px;right:14px;border:1px solid var(--border);background:var(--surface);color:var(--muted);
font:inherit;font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;cursor:pointer;opacity:0;transition:.15s}
.wrap:hover .shuf,.shuf:focus-visible{opacity:1}
.shuf:hover{color:var(--fg);border-color:color-mix(in oklab,var(--fg) 20%,var(--border))}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:480px){.quote{font-size:16.5px}.wrap{padding:16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="day" id="day"></div>
  <div class="mark">“</div>
  <div class="quote" id="quote"></div>
  <div class="by"><span class="rule"></span><b id="author"></b><span id="src"></span></div>
  <button class="shuf" id="shuf" type="button">Shuffle</button>
</div>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};
  try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];
  q.forEach(function(v,k){c[k]=v;});
  function bool(k,d){var v=c[k];return v===undefined?d:(v===true||v==='true'||v==='1');}

  var ACCENT=c.accent||'#dfab01';
  if(c.theme)document.documentElement.setAttribute('data-theme',c.theme);
  document.documentElement.style.setProperty('--accent',ACCENT);
  if(!bool('serif',true))document.getElementById('quote').classList.add('sans');

  var DEFAULT=[
    ["The best way out is always through.","Robert Frost"],
    ["Simplicity is the ultimate sophistication.","Leonardo da Vinci"],
    ["What we think, we become.","Buddha"],
    ["Well begun is half done.","Aristotle"],
    ["It always seems impossible until it's done.","Nelson Mandela"],
    ["The obstacle is the way.","Marcus Aurelius"],
    ["Action is the foundational key to all success.","Pablo Picasso"],
    ["First, solve the problem. Then, write the code.","John Johnson"],
    ["Perfection is achieved not when there is nothing more to add, but when there is nothing left to take away.","Antoine de Saint-Exupéry"],
    ["Discipline equals freedom.","Jocko Willink"],
    ["You do not rise to the level of your goals. You fall to the level of your systems.","James Clear"],
    ["The impediment to action advances action.","Marcus Aurelius"],
    ["Make it work, make it right, make it fast.","Kent Beck"],
    ["A year from now you may wish you had started today.","Karen Lamb"],
    ["Do the hard jobs first. The easy jobs will take care of themselves.","Dale Carnegie"],
    ["If you want to go fast, go alone. If you want to go far, go together.","African proverb"],
    ["Clarity precedes success.","Unknown"],
    ["Focus is a matter of deciding what things you're not going to do.","John Carmack"],
    ["The way to get started is to quit talking and begin doing.","Walt Disney"],
    ["Everything you've ever wanted is on the other side of fear.","George Addair"],
    ["We are what we repeatedly do. Excellence, then, is not an act, but a habit.","Will Durant"],
    ["Start where you are. Use what you have. Do what you can.","Arthur Ashe"],
    ["Fall seven times, stand up eight.","Japanese proverb"],
    ["A ship in harbour is safe, but that is not what ships are built for.","John A. Shedd"],
    ["Either you run the day, or the day runs you.","Jim Rohn"],
    ["There is no substitute for hard work.","Thomas Edison"],
    ["What gets measured gets managed.","Peter Drucker"],
    ["Never confuse motion with action.","Benjamin Franklin"],
    ["Small deeds done are better than great deeds planned.","Peter Marshall"],
    ["The secret of getting ahead is getting started.","Mark Twain"]
  ];

  var list=DEFAULT;
  if(c.quotes){
    try{
      var raw=decodeURIComponent(String(c.quotes));
      var parsed=raw.split('||').map(function(pair){
        var parts=pair.split('|');
        return {q:(parts[0]||'').trim(),a:(parts[1]||'').trim()};
      }).filter(function(o){return o.q;});
      if(parsed.length)list=parsed.map(function(o){return [o.q,o.a];});
    }catch(e){}
  }

  var KEY='notion-arena.quote.offset';
  var offset=0;
  try{offset=parseInt(localStorage.getItem(KEY)||'0',10)||0;}catch(e){}

  function dayIndex(){
    var n=new Date(),s=new Date(n.getFullYear(),0,1);
    return Math.floor((n-s)/864e5)+offset;
  }
  var elQ=document.getElementById('quote'),elA=document.getElementById('author'),
      elD=document.getElementById('day'),elS=document.getElementById('src'),
      elB=document.getElementById('shuf');
  function render(){
    var i=((dayIndex()%list.length)+list.length)%list.length;
    var item=list[i];
    elQ.textContent=item[0];
    elA.textContent=item[1]||'';
    elS.textContent=list.length>1?'· '+(i+1)+' of '+list.length:'';
    elQ.classList.remove('fade');void elQ.offsetWidth;elQ.classList.add('fade');
  }
  elD.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
  elB.addEventListener('click',function(){offset++;try{localStorage.setItem(KEY,String(offset));}catch(e){}render();});
  render();
})();
</script>
</body>
</html>
