<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>KPI Strip</title>
<style>
:root{--bg:#ffffff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#0f7b6c;
--good:#0f7b6c;--bad:#e03e3e;--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#2f2f2f;--good:#4dab9a;--bad:#ff7369}
@media (prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#2f2f2f;--good:#4dab9a;--bad:#ff7369}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{height:100%;padding:12px;display:grid;gap:10px;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));align-content:center}
.tile{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:11px 12px;display:flex;flex-direction:column;gap:7px;min-width:0;position:relative;overflow:hidden}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.name{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.value{font-size:24px;font-weight:640;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.value small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:-.01em;margin-left:1px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.delta.flat{color:var(--muted)}
.spark{width:74px;height:24px;flex:0 0 auto}
.spark path.line{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.spark path.area{fill:color-mix(in oklab,var(--accent) 14%,transparent);stroke:none}
.ring{width:26px;height:26px;flex:0 0 auto;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.4}
.ring .bg{stroke:var(--border)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.target{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:560px){.wrap{--cols:2 !important}.spark{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};
  try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];
  q.forEach(function(v,k){c[k]=v;});

  var ACCENT=c.accent||'#0f7b6c';
  if(c.theme)document.documentElement.setAttribute('data-theme',c.theme);
  document.documentElement.style.setProperty('--accent',ACCENT);
  var wrap=document.getElementById('wrap');
  wrap.style.setProperty('--cols',String(Math.max(1,Math.min(4,parseInt(c.cols||'4',10)||4))));

  var DEMO=[
    {label:'MRR',value:48200,unit:'$',prefix:true,delta:8.4,target:60000,series:[31,33,34,36,38,37,40,42,43,45,46,48.2],goodWhen:'up'},
    {label:'Active users',value:3184,delta:3.1,target:4000,series:[2400,2500,2560,2650,2700,2810,2880,2950,3010,3090,3140,3184],goodWhen:'up'},
    {label:'Churn',value:2.4,unit:'%',delta:-0.6,target:2.0,series:[3.6,3.5,3.4,3.2,3.3,3.1,2.9,2.8,2.7,2.6,2.5,2.4],goodWhen:'down'},
    {label:'NPS',value:61,delta:4,target:70,series:[44,46,47,49,50,52,53,55,56,58,59,61],goodWhen:'up'}
  ];
  var data=DEMO;
  if(c.data){
    try{
      var parsed=typeof c.data==='string'?JSON.parse(decodeURIComponent(c.data)):c.data;
      if(Array.isArray(parsed)&&parsed.length)data=parsed;
    }catch(e){}
  }

  function fmtNum(n){
    if(typeof n!=='number'||!isFinite(n))return String(n);
    var a=Math.abs(n);
    if(a>=1e6)return (n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+'M';
    if(a>=1e4)return (n/1e3).toFixed(0)+'k';
    if(a>=1e3)return n.toLocaleString(undefined,{maximumFractionDigits:0});
    if(a>=100)return n.toFixed(0);
    if(a>=10)return n.toFixed(1).replace(/\.0$/,'');
    return n.toFixed(2).replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1');
  }
  function spark(series,color){
    if(!Array.isArray(series)||series.length<2)return '';
    var w=74,h=24,pad=2;
    var min=Math.min.apply(null,series),max=Math.max.apply(null,series),rng=(max-min)||1;
    var pts=series.map(function(v,i){
      var x=pad+(i*(w-pad*2))/(series.length-1);
      var y=h-pad-((v-min)/rng)*(h-pad*2);
      return [x,y];
    });
    var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
    var area=d+' L'+pts[pts.length-1][0].toFixed(1)+' '+h+' L'+pts[0][0].toFixed(1)+' '+h+' Z';
    return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
      '<path class="area" d="'+area+'"></path><path class="line" d="'+d+'"></path></svg>';
  }
  function ring(pct){
    var r=10,circ=2*Math.PI*r,off=circ*(1-Math.max(0,Math.min(1,pct)));
    return '<svg class="ring" viewBox="0 0 26 26" aria-hidden="true">'+
      '<circle class="bg" cx="13" cy="13" r="'+r+'"></circle>'+
      '<circle class="fg" cx="13" cy="13" r="'+r+'" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"></circle></svg>';
  }
  function tile(m){
    var delta=typeof m.delta==='number'?m.delta:null;
    var dCls='flat',arrow='→';
    if(delta!==null){
      var good=m.goodWhen==='down'?(delta<0):(delta>0);
      if(delta===0){dCls='flat';arrow='→';}
      else{dCls=good?'up':'down';arrow=delta>0?'↑':'↓';}
    }
    var unit=m.unit||'',prefix=!!m.prefix;
    var val=(prefix?unit:'')+fmtNum(m.value)+(prefix?'':unit);
    var pct=(typeof m.target==='number'&&m.target)?m.value/m.target:null;
    var targetTxt=pct!==null?Math.round(pct*100)+'% of '+fmtNum(m.target):'';
    return '<div class="tile">'+
      '<div class="head"><span class="name">'+String(m.label||'').replace(/[<>&]/g,'')+'</span></div>'+
      '<div class="value">'+val+'</div>'+
      '<div class="foot">'+
        '<span class="delta '+dCls+'">'+arrow+(delta!==null?' '+Math.abs(delta).toFixed(1)+'%':'')+'</span>'+
        spark(m.series)+
        (pct!==null?ring(pct):'')+
      '</div>'+
      (targetTxt?'<div class="target">'+targetTxt+'</div>':'')+
    '</div>';
  }
  wrap.innerHTML=data.slice(0,4).map(tile).join('');
})();
</script>
</body>
</html>
