<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Study Session Log</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#6b6a68;--surface:#f7f7f5;--border:#e9e9e7;--accent:#0f7b6c;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}.wrap{height:100%;min-height:250px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:14px;font-weight:650;margin-top:2px}.totals{display:flex;gap:9px}.total{font-size:8.5px;color:var(--muted);text-align:right}.total b{display:block;color:var(--accent-text);font-size:12px;font-variant-numeric:tabular-nums}.form{display:grid;grid-template-columns:minmax(0,1fr) 112px 96px auto;gap:5px}.form input{min-width:0;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 6px;font:inherit;font-size:9.5px}.form input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form button{height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}.list{display:flex;min-height:60px;flex:1;flex-direction:column;gap:4px;overflow:auto}.row{display:grid;grid-template-columns:minmax(0,1fr) auto 23px;gap:3px 7px;padding:6px 7px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.topic{min-width:0;overflow-wrap:anywhere;font-size:10px;font-weight:600}.minutes{font-size:9.5px;color:var(--accent-text);font-variant-numeric:tabular-nums;white-space:nowrap}.meta{grid-column:1/3;color:var(--muted);font-size:8.5px}.remove{grid-column:3;grid-row:1/3;width:22px;height:22px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.empty{text-align:center;padding:12px;color:var(--muted);font-size:10px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.status,.note{font-size:9px;color:var(--muted);line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}@media(max-width:360px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 96px}.form button{grid-column:2}.totals{gap:5px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Manual study record</div><div class="title" id="title">Study sessions</div></div><div class="totals"><div class="total">Logged<b id="timeTotal">0m</b></div><div class="total">Sessions<b id="sessionCount">0</b></div></div></header>
  <form class="form" id="form"><label class="sr-only" for="topic">Topic</label><input id="topic" maxlength="56" placeholder="Subject or topic" required /><label class="sr-only" for="minutes">Minutes studied</label><input id="minutes" type="number" min="1" max="720" step="1" placeholder="Minutes" required /><label class="sr-only" for="date">Study date</label><input id="date" type="date" required /><button type="submit">Log</button></form>
  <section class="list" id="list" aria-label="Study sessions"></section>
  <footer class="foot"><span class="status" id="status" aria-live="polite">Sessions save only in this browser.</span><button class="clear" id="clear" type="button">Clear log</button></footer>
  <div class="note">Minutes are entered manually. This is not a timer, grade prediction, or shared study record.</div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(h){var s=String(h).slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function ratio(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function ink(h){var a=rgb(h);return ratio(a,[255,255,255])>=ratio(a,[0,0,0])?'#fff':'#000';}function textColor(h){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(h),to=dark?[255,255,255]:[0,0,0];if(ratio(a,bg)>=4.5)return h;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(ratio(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}function setText(){document.documentElement.style.setProperty('--accent-text',textColor(ACCENT));}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>=0?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#0f7b6c'),LABEL=String(c.label||'Study sessions').slice(0,48),KEY='notion-arena.study-session-log.v1',items=[];
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',ink(ACCENT));setText();if(theme==='auto'&&window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',setText);else if(mq.addListener)mq.addListener(setText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;
  function dateKey(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}var date=document.getElementById('date');date.value=dateKey();try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))items=a.filter(function(x){return x&&typeof x.topic==='string'&&isFinite(Number(x.minutes));}).slice(0,100);}catch(e){}
  var list=document.getElementById('list'),status=document.getElementById('status');function save(msg){try{localStorage.setItem(KEY,JSON.stringify(items));status.textContent=msg||'Sessions save only in this browser.';}catch(e){status.textContent='Storage is unavailable in this browser session.';}}function pretty(n){n=Number(n)||0;var h=Math.floor(n/60),m=n%60;return h? h+'h '+m+'m':m+'m';}function formatDate(v){var d=new Date(v+'T00:00:00');return isNaN(d.getTime())?v:new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(d);}
  function render(){list.textContent='';var total=items.reduce(function(s,x){return s+Number(x.minutes||0);},0);document.getElementById('timeTotal').textContent=pretty(total);document.getElementById('sessionCount').textContent=String(items.length);if(!items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Log a study session to see your history.';list.appendChild(empty);return;}items.slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));}).forEach(function(item){var index=items.indexOf(item),row=document.createElement('div');row.className='row';var topic=document.createElement('span');topic.className='topic';topic.textContent=item.topic;var minutes=document.createElement('span');minutes.className='minutes';minutes.textContent=pretty(item.minutes);var meta=document.createElement('span');meta.className='meta';meta.textContent=formatDate(item.date||'');var remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove session: '+item.topic);remove.addEventListener('click',function(){items.splice(index,1);save();render();});row.append(topic,minutes,meta,remove);list.appendChild(row);});}
  document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var topic=document.getElementById('topic').value.trim().slice(0,56),minutes=Number(document.getElementById('minutes').value),day=date.value;if(!topic||!isFinite(minutes)||minutes<1||minutes>720||!/^\d{4}-\d{2}-\d{2}$/.test(day))return;if(items.length>=100){status.textContent='Session limit reached.';return;}items.push({topic:topic,minutes:Math.round(minutes),date:day});document.getElementById('topic').value='';document.getElementById('minutes').value='';date.value=dateKey();save();render();document.getElementById('topic').focus();});document.getElementById('clear').addEventListener('click',function(){items=[];save('Study log cleared.');render();});render();
})();
</script>
</body>
</html>
