<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Plant Care Log</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#0f7b6c;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}.wrap{height:100%;min-height:260px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:14px;font-weight:650;margin-top:2px}.count{font-size:9px;color:var(--muted);text-align:right}.count b{display:block;color:var(--accent-text);font-size:12px}.form{display:grid;grid-template-columns:minmax(0,1fr) 96px 96px auto;gap:5px}.form input,.form select{min-width:0;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 6px;font:inherit;font-size:9.5px}.form .plant{grid-column:1/2}.form .note{grid-column:1/4}.form input:focus-visible,.form select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form button{height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}.form button:focus-visible,.remove:focus-visible,.clear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.list{display:flex;min-height:70px;flex:1;flex-direction:column;gap:4px;overflow:auto}.entry{display:grid;grid-template-columns:minmax(0,1fr) auto 24px;gap:2px 7px;padding:6px 7px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.plant-name{min-width:0;overflow-wrap:anywhere;font-size:10px;font-weight:600}.date{font-size:9px;color:var(--accent-text);font-variant-numeric:tabular-nums}.detail{grid-column:1/3;min-width:0;overflow-wrap:anywhere;color:var(--muted);font-size:9px}.remove{grid-column:3;grid-row:1/3;width:23px;height:23px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.status,.note{font-size:9px;color:var(--muted);line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}.empty{text-align:center;padding:12px;color:var(--muted);font-size:10px}@media(max-width:350px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 94px}.form .plant{grid-column:1/3}.form .note{grid-column:1/3}.form button{grid-column:1/3}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Manual care history</div><div class="title" id="title">Plant care log</div></div><div class="count"><b id="count">0</b>entries</div></header>
  <form class="form" id="form"><label class="sr-only" for="plant">Plant name</label><input class="plant" id="plant" maxlength="48" placeholder="Plant name" required /><label class="sr-only" for="date">Care date</label><input id="date" type="date" required /><label class="sr-only" for="action">Care activity</label><select id="action"><option>Watered</option><option>Pruned</option><option>Repotted</option><option>Checked</option><option>Other</option></select><label class="sr-only" for="note">Note</label><input class="note" id="note" maxlength="80" placeholder="Optional note" /><button type="submit">Log care</button></form>
  <section class="list" id="list" aria-label="Plant care history"></section>
  <footer class="foot"><span class="status" id="status" aria-live="polite">Log stays in this browser. No reminders or sync.</span><button class="clear" id="clear" type="button">Clear log</button></footer>
  <div class="note">A personal record only. It does not recommend a watering schedule or diagnose plant health.</div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(hex){var s=String(hex).slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function contrast(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function accentInk(hex){var a=rgb(hex);return contrast(a,[255,255,255])>=contrast(a,[0,0,0])?'#fff':'#000';}function accentText(hex){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(hex),to=dark?[255,255,255]:[0,0,0];if(contrast(a,bg)>=4.5)return hex;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(contrast(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}function setAccentText(){document.documentElement.style.setProperty('--accent-text',accentText(ACCENT));}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>-1?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#0f7b6c'),LABEL=String(c.label||'Plant care log').slice(0,48),KEY='blocksmith.plant-care-log.v1',items=[];
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',accentInk(ACCENT));setAccentText();if(theme==='auto'&&window.matchMedia){var scheme=window.matchMedia('(prefers-color-scheme: dark)');if(scheme.addEventListener)scheme.addEventListener('change',setAccentText);else if(scheme.addListener)scheme.addListener(setAccentText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;
  function dateKey(d){var x=d||new Date();return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10);}var date=document.getElementById('date');date.value=dateKey();try{var parsed=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(parsed))items=parsed.filter(function(x){return x&&typeof x.plant==='string'&&typeof x.date==='string';}).slice(0,80);}catch(e){}
  var list=document.getElementById('list'),status=document.getElementById('status');function save(message){try{localStorage.setItem(KEY,JSON.stringify(items));status.textContent=message||'Log stays in this browser. No reminders or sync.';}catch(e){status.textContent='Storage is unavailable in this browser session.';}}
  function formatDate(value){var d=new Date(value+'T00:00:00');return isNaN(d.getTime())?value:new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(d);}
  function render(){list.textContent='';document.getElementById('count').textContent=String(items.length);if(!items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Add a plant care event to start your log.';list.appendChild(empty);return;}items.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).forEach(function(item){var index=items.indexOf(item),row=document.createElement('div');row.className='entry';var name=document.createElement('span');name.className='plant-name';name.textContent=item.plant;var day=document.createElement('span');day.className='date';day.textContent=formatDate(item.date);var detail=document.createElement('span');detail.className='detail';detail.textContent=item.action+(item.note?' · '+item.note:'');var remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove care entry for '+item.plant);remove.addEventListener('click',function(){items.splice(index,1);save();render();});row.append(name,day,detail,remove);list.appendChild(row);});}
  document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var plant=document.getElementById('plant').value.trim().slice(0,48),day=date.value,action=document.getElementById('action').value,note=document.getElementById('note').value.trim().slice(0,80);if(!plant||!/^\d{4}-\d{2}-\d{2}$/.test(day))return;if(items.length>=80){status.textContent='Log limit reached.';return;}items.push({plant:plant,date:day,action:action,note:note});document.getElementById('plant').value='';document.getElementById('note').value='';date.value=dateKey();save();render();document.getElementById('plant').focus();});document.getElementById('clear').addEventListener('click',function(){items=[];save('Care log cleared.');render();});render();
})();
</script>
</body>
</html>
