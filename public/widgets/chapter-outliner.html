<!doctype html>
<html lang="en" data-theme="auto">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Chapter Outliner</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#6b6a68;--surface:#f7f7f5;--border:#e9e9e7;--accent:#d9730d;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{overflow:hidden;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrap{height:100%;min-height:275px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{margin-top:2px;font-size:14px;font-weight:650}.count{text-align:right;color:var(--muted);font-size:9px}.count b{display:block;color:var(--accent-text);font-size:12px}.form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px}.form input,.form textarea{width:100%;min-width:0;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:5px 7px;font:inherit;font-size:9px}.form input{height:30px}.form textarea{grid-column:1/3;min-height:40px;resize:vertical;line-height:1.35}.form input:focus-visible,.form textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form button{grid-column:2;height:29px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 8px;cursor:pointer}.list{display:flex;flex:1;min-height:55px;flex-direction:column;gap:4px;overflow:auto}.row{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto 22px;align-items:center;gap:5px;padding:5px 6px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.num{color:var(--accent-text);font:600 9px ui-monospace,monospace;text-align:center}.chapter{min-width:0;overflow-wrap:anywhere;font-size:9.5px;font-weight:650}.summary{grid-column:2/5;overflow-wrap:anywhere;color:var(--muted);font-size:8.5px;line-height:1.35}.move,.remove{width:21px;height:21px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.move:disabled{opacity:.45;cursor:default}.move:not(:disabled):hover,.remove:hover{border-color:var(--accent);color:var(--accent-text)}.remove:hover{border-color:var(--danger);color:var(--danger)}.empty{text-align:center;padding:12px;color:var(--muted);font-size:10px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.msg,.note{color:var(--muted);font-size:9px;line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}@media(max-width:350px){.wrap{padding:10px}.row{grid-template-columns:23px minmax(0,1fr) 22px 22px 22px;gap:3px}.summary{grid-column:2/6}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head>
<body><main class="wrap"><header class="head"><div><div class="kicker">A flexible chapter order</div><div class="title" id="title">Chapter outliner</div></div><div class="count"><b id="count">0</b>chapters</div></header>
<form class="form" id="form"><label class="sr-only" for="chapter">Chapter title</label><input id="chapter" maxlength="72" placeholder="Chapter title" required /><label class="sr-only" for="summary">Chapter summary</label><textarea id="summary" maxlength="260" placeholder="One-line summary (optional)"></textarea><button type="submit">Add chapter</button></form>
<section class="list" id="list" aria-label="Chapter outline"></section><footer class="foot"><span class="msg" id="msg" aria-live="polite">Outline saves only in this browser.</span><button class="clear" id="clear" type="button">Clear outline</button></footer><div class="note">A personal drafting aid. Chapter notes are not encrypted or synced.</div></main>
<script>
(function(){var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(h){var s=h.slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function contrast(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function ink(h){var a=rgb(h);return contrast(a,[255,255,255])>=contrast(a,[0,0,0])?'#fff':'#000';}function textColor(h){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(h),to=dark?[255,255,255]:[0,0,0];if(contrast(a,bg)>=4.5)return h;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(contrast(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>=0?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#d9730d'),LABEL=String(c.label||'Chapter outliner').slice(0,48),KEY='blocksmith.chapter-outliner.v1',chapters=[];function setText(){document.documentElement.style.setProperty('--accent-text',textColor(ACCENT));}document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',ink(ACCENT));setText();if(theme==='auto'&&window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',setText);else if(mq.addListener)mq.addListener(setText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))chapters=a.filter(function(x){return x&&typeof x.title==='string';}).slice(0,80);}catch(e){}var list=document.getElementById('list'),msg=document.getElementById('msg');function save(text){try{localStorage.setItem(KEY,JSON.stringify(chapters));msg.textContent=text||'Outline saves only in this browser.';}catch(e){msg.textContent='Storage is unavailable in this browser session.';}}function render(){list.textContent='';document.getElementById('count').textContent=String(chapters.length);if(!chapters.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Add chapters, then reorder them with the move controls.';list.appendChild(empty);return;}chapters.forEach(function(item,index){var row=document.createElement('div');row.className='row';var n=document.createElement('span');n.className='num';n.textContent=String(index+1).padStart(2,'0');var title=document.createElement('span');title.className='chapter';title.textContent=item.title;var up=document.createElement('button');up.className='move';up.type='button';up.textContent='↑';up.disabled=index===0;up.setAttribute('aria-label','Move '+item.title+' up');up.addEventListener('click',function(){if(index>0){var tmp=chapters[index-1];chapters[index-1]=chapters[index];chapters[index]=tmp;save('Chapter order updated.');render();}});var down=document.createElement('button');down.className='move';down.type='button';down.textContent='↓';down.disabled=index===chapters.length-1;down.setAttribute('aria-label','Move '+item.title+' down');down.addEventListener('click',function(){if(index<chapters.length-1){var tmp=chapters[index+1];chapters[index+1]=chapters[index];chapters[index]=tmp;save('Chapter order updated.');render();}});var summary=document.createElement('span');summary.className='summary';summary.textContent=item.summary||'No summary';var remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove chapter: '+item.title);remove.addEventListener('click',function(){chapters.splice(chapters.indexOf(item),1);save();render();});row.append(n,title,up,down,remove,summary);list.appendChild(row);});}document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var title=document.getElementById('chapter').value.trim().slice(0,72),summary=document.getElementById('summary').value.trim().slice(0,260);if(!title)return;if(chapters.length>=80){msg.textContent='Chapter limit reached.';return;}chapters.push({title:title,summary:summary});document.getElementById('chapter').value='';document.getElementById('summary').value='';save();render();document.getElementById('chapter').focus();});document.getElementById('clear').addEventListener('click',function(){chapters=[];save('Outline cleared.');render();});render();})();
</script></body></html>
