<!doctype html>
<html lang="en" data-theme="auto">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Team Directory</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#777672;--surface:#f7f7f5;--border:#e9e9e7;--accent:#2383e2;--accent-text:#1765a8;--accent-ink:#fff;--danger:#c24136;--soft:color-mix(in srgb,var(--accent) 10%,var(--bg))}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#aaa9a5;--surface:#222;--border:#363636;--danger:#ff8177}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#aaa9a5;--surface:#222;--border:#363636;--danger:#ff8177}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{overflow:hidden;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{height:100%;min-height:275px;display:flex;flex-direction:column;gap:9px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}.brand{display:flex;align-items:center;gap:8px;min-width:0}.mark{width:30px;height:30px;display:grid;place-items:center;flex:none;border-radius:8px;background:var(--soft);color:var(--accent-text)}.mark svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}.title{margin-top:2px;font-size:14px;line-height:1.25;font-weight:650;overflow-wrap:anywhere}.metric{flex:none;min-width:52px;padding:5px 7px;border-radius:7px;background:var(--soft);color:var(--accent-text);text-align:center;font-size:10px;font-weight:650;font-variant-numeric:tabular-nums}
.toolbar{display:flex;align-items:center;gap:6px;min-width:0}.toolbar>*{min-width:0}.form-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end}.field{grid-column:span 4;min-width:0;display:flex;flex-direction:column;gap:3px}.field.wide{grid-column:span 6}.field.full{grid-column:1/-1}.field.third{grid-column:span 3}.field label{font-size:9px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea,.search{width:100%;min-width:0;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:6px 7px;font-size:10px;outline:none}.field input,.field select,.search{height:31px}.field textarea{min-height:46px;line-height:1.4;resize:vertical}.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible,.search:focus-visible{outline:2px solid var(--accent-text);outline-offset:1px}.btn{min-height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:5px 9px;font-size:10px;font-weight:600}.btn:hover,.icon-btn:hover{border-color:var(--accent-text)}.btn.primary{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}.btn.primary:hover{filter:brightness(.96)}.btn.small{min-height:25px;padding:3px 7px;font-size:9px}.icon-btn{min-width:28px;min-height:27px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);padding:3px 6px;font-size:10px}.icon-btn:hover{color:var(--danger);border-color:var(--danger)}
.list{display:flex;flex:1;min-height:55px;flex-direction:column;gap:5px;overflow:auto}.entry{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-width:0;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.entry-main{flex:1;min-width:0}.entry-title{font-size:11px;font-weight:650;overflow-wrap:anywhere;line-height:1.35}.sub{margin-top:3px;color:var(--muted);font-size:9px;line-height:1.4;overflow-wrap:anywhere}.details{margin-top:5px;color:var(--fg);font-size:10px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}.row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.actions{display:flex;align-items:center;gap:4px;flex:none}.select-mini{max-width:125px;height:26px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);padding:3px 5px;font-size:9px}.chip{display:inline-flex;align-items:center;min-height:19px;padding:2px 6px;border-radius:999px;background:var(--soft);color:var(--accent-text);font-size:8px;font-weight:650;white-space:nowrap}.empty{padding:13px 8px;border:1px dashed var(--border);border-radius:8px;color:var(--muted);text-align:center;font-size:10px;line-height:1.45}.notice{color:var(--muted);font-size:9px;line-height:1.4}.footer{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-top:1px solid var(--border);padding-top:6px}.message{color:var(--muted);font-size:9px;line-height:1.35;text-align:right}.search{flex:1}.weekbar{display:flex;align-items:center;justify-content:space-between;gap:6px}.week-label{font-size:10px;font-weight:650;text-align:center}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day-btn{min-width:0;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--muted);padding:5px 2px;font-size:8px;line-height:1.3}.day-btn strong{display:block;margin-top:2px;color:var(--fg);font-size:10px}.day-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent-text)}.day-btn[aria-pressed="true"] strong{color:var(--accent-text)}.task{display:flex;align-items:flex-start;gap:7px;min-width:0}.task input{accent-color:var(--accent);margin:2px 0 0}.task.done .entry-title{text-decoration:line-through;color:var(--muted)}.progress{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:9px}.bar{height:4px;flex:1;overflow:hidden;border-radius:99px;background:var(--border)}.bar span{display:block;height:100%;background:var(--accent);border-radius:inherit}.avatar{width:28px;height:28px;display:grid;place-items:center;flex:none;border-radius:8px;background:var(--soft);color:var(--accent-text);font-size:9px;font-weight:700}.score-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.score-grid .field{grid-column:auto}.totals{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-variant-numeric:tabular-nums}.total-label{color:var(--muted);font-size:9px}.total-value{font-size:10px;text-align:right}.grand{padding-top:5px;border-top:1px solid var(--border);font-weight:700;color:var(--fg)}
@media(max-width:410px){.wrap{padding:10px;gap:7px}.field{grid-column:span 6}.field.third{grid-column:span 6}.field.full{grid-column:1/-1}.score-grid{grid-template-columns:1fr 1fr}.entry{gap:5px;padding:7px}.select-mini{max-width:110px}.footer{flex-direction:column}.message{text-align:left}.days{gap:2px}.day-btn{font-size:7px;padding:4px 1px}}
@media(max-width:290px){.metric{min-width:42px;padding:4px;font-size:9px}.title{font-size:12px}.field{grid-column:1/-1}.score-grid{grid-template-columns:1fr}.actions{gap:2px}.btn{padding:4px 6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
<header class="head"><div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19v-1.5A4.5 4.5 0 0 1 8 13h2a4.5 4.5 0 0 1 4.5 4.5V19z"/><path d="M16 5.5a3 3 0 0 1 0 5.8M17 13.5a4 4 0 0 1 3.5 4V19h-4"/></svg></span><div><div class="kicker">TEAM REFERENCE</div><div class="title" id="title">Team Directory</div></div></div><div class="metric" id="metric">0</div></header>
<form class="form-grid" id="form"><div class="field wide"><label for="personName">Name or label</label><input id="personName" maxlength="70" placeholder="Name or team alias" required /></div><div class="field wide"><label for="role">Role</label><input id="role" maxlength="70" placeholder="Role or area" required /></div><div class="field third"><label for="team">Team</label><select id="team"><option>Product</option><option>Design</option><option>Engineering</option><option>Operations</option><option>Other</option></select></div><div class="field third"><label for="timezone">Time zone</label><input id="timezone" maxlength="28" placeholder="e.g. UTC+5" /></div><div class="field third"><label for="location">Work mode</label><select id="location"><option>Remote</option><option>Office</option><option>Hybrid</option><option>Unspecified</option></select></div><button class="btn primary field full" type="submit">Add person</button></form>
<div class="toolbar"><input class="search" id="search" type="search" placeholder="Search people, roles, teams" aria-label="Search team directory" /><span class="notice" id="count"></span></div><section class="list" id="list" aria-label="Team members"></section>
<footer class="footer"><span class="notice">Names and role labels stay in this browser. Avoid sensitive contact details.</span><span class="message" id="status" role="status" aria-live="polite">Saved only in this browser.</span></footer>
</main>
<script>(function(){
var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}
var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>=0?String(c.theme||'auto'):'auto';
var ACCENT=safeColor(c.accent,'#9065b0'),LABEL=String(c.label||'Team directory').slice(0,48),KEY='blocksmith.team-directory.v1';
document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.getElementById('title').textContent=LABEL;document.title=LABEL;
function rgb(h){var s=h.slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(sum,v,i){return sum+v*[.2126,.7152,.0722][i];},0);}function ratio(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function hex(a){return'#'+a.map(function(v){return Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0');}).join('');}function mix(a,b,t){return a.map(function(v,i){return Math.round(v+(b[i]-v)*t);});}function setAccentText(){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#191919':'#f7f7f5'),a=rgb(ACCENT),soft=mix(bg,a,.1),target=dark?[255,255,255]:[0,0,0],text=a;for(var t=.02;t<=1;t+=.02){if(ratio(text,soft)>=4.5)break;text=mix(a,target,t);}var black=[0,0,0],white=[255,255,255],ink=ratio(a,black)>=ratio(a,white)?black:white;document.documentElement.style.setProperty('--accent-text',hex(text));document.documentElement.style.setProperty('--accent-ink',hex(ink));}setAccentText();if(theme==='auto'&&window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',setAccentText);else if(mq.addListener)mq.addListener(setAccentText);}
var savedData={},items=[];try{var raw=JSON.parse(localStorage.getItem(KEY)||'{}');if(raw&&typeof raw==='object'){savedData=Array.isArray(raw)?{items:raw}:raw;}if(Array.isArray(savedData.items))items=savedData.items.filter(function(x){return x&&typeof x.id==='string';}).slice(0,200);}catch(e){}
function announce(text){var n=document.getElementById('status');if(n)n.textContent=text;}
function save(text){savedData.items=items;try{localStorage.setItem(KEY,JSON.stringify(savedData));announce(text||'Saved in this browser.');}catch(e){announce('Browser storage is unavailable. Changes may not persist.');}}
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined&&text!==null)n.textContent=String(text);return n;}
function clean(s,max){return String(s||'').trim().slice(0,max);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function bindDelete(id){var root=document.getElementById(id);root.addEventListener('click',function(e){var node=e.target;while(node&&node!==root){if(node.getAttribute){var key=node.getAttribute('data-remove');if(key){items=items.filter(function(x){return x.id!==key;});save('Entry removed.');render();return;}}node=node.parentNode;}});}
function initials(s){return String(s||'?').trim().split(/\s+/).slice(0,2).map(function(x){return x.charAt(0).toUpperCase();}).join('')||'?';}function render(){var list=document.getElementById('list');list.textContent='';var term=document.getElementById('search').value.trim().toLowerCase();var shown=items.filter(function(x){return !term||(x.name+' '+x.role+' '+x.team+' '+x.timezone).toLowerCase().indexOf(term)>=0;}).sort(function(a,b){return a.name.localeCompare(b.name);});document.getElementById('metric').textContent=items.length+' people';document.getElementById('count').textContent=shown.length+' shown';if(!shown.length){list.appendChild(el('div','empty',items.length?'No team members match.':'Add a role-based entry to start the directory.'));return;}shown.forEach(function(item,i){var row=el('article','entry'),av=el('div','avatar',''),main=el('div','entry-main');av.textContent=initials(item.name);av.style.background='var(--soft)';var t=el('div','entry-title',item.name),meta=el('div','row');meta.appendChild(el('span','chip',item.team));meta.appendChild(el('span','sub',item.role));if(item.timezone)meta.appendChild(el('span','sub',item.timezone));meta.appendChild(el('span','sub',item.location));main.appendChild(t);main.appendChild(meta);row.appendChild(av);row.appendChild(main);var del=el('button','icon-btn','Remove');del.type='button';del.setAttribute('data-remove',item.id);del.setAttribute('aria-label','Remove '+item.name);row.appendChild(del);list.appendChild(row);});}document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var name=clean(document.getElementById('personName').value,70),role=clean(document.getElementById('role').value,70);if(!name||!role)return;if(items.length>=100){announce('Directory limit reached.');return;}items.push({id:uid(),name:name,role:role,team:document.getElementById('team').value,timezone:clean(document.getElementById('timezone').value,28),location:document.getElementById('location').value});this.reset();save();render();document.getElementById('personName').focus();});document.getElementById('search').addEventListener('input',render);bindDelete('list');render();
})();</script>
</body></html>
