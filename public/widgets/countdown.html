<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Event Countdown</title>
<style>
:root{--bg:#ffffff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#d9730d;
--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#2f2f2f}
@media (prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#2f2f2f}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;text-align:center}
.label{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.units{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.unit{min-width:78px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.unit b{display:block;font-size:30px;font-weight:650;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--accent)}
.unit span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.target{font-size:12px;color:var(--muted)}
.done b{color:var(--accent)}
.compact .unit{min-width:60px;padding:7px 9px;border-radius:9px}
.compact .unit b{font-size:21px}
.wrap.compact{gap:8px}
.bar{width:min(420px,100%);height:5px;border-radius:99px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}
@media (max-width:420px){.unit{min-width:64px}.unit b{font-size:24px}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="label" id="label">Launch day</div>
  <div class="units" id="units">
    <div class="unit"><b id="d">0</b><span>days</span></div>
    <div class="unit"><b id="h">0</b><span>hrs</span></div>
    <div class="unit"><b id="m">0</b><span>min</span></div>
    <div class="unit"><b id="s">0</b><span>sec</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="target" id="target"></div>
</div>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};
  try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];
  q.forEach(function(v,k){c[k]=v;});
  function bool(k,d){var v=c[k];return v===undefined?d:(v===true||v==='true'||v==='1');}

  var ACCENT=c.accent||'#d9730d';
  if(c.theme)document.documentElement.setAttribute('data-theme',c.theme);
  if(bool('compact',false))document.getElementById('wrap').classList.add('compact');
  document.documentElement.style.setProperty('--accent',ACCENT);
  document.getElementById('label').textContent=c.label||'Launch day';

  var raw=c.to||'';
  var target=raw?new Date(raw.indexOf('T')>-1?raw:raw+'T00:00:00'):null;
  if(!target||isNaN(target))target=new Date(Date.now()+30*864e5);
  var span=Math.max(target.getTime()-Date.now(),864e5*30);
  var startAt=target.getTime()-span;

  var ids={d:document.getElementById('d'),h:document.getElementById('h'),m:document.getElementById('m'),s:document.getElementById('s')};
  var bar=document.getElementById('bar'),wrap=document.getElementById('wrap'),label=document.getElementById('label');
  document.getElementById('target').textContent=target.toLocaleString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  function pad(n){return n<10?'0'+n:''+n;}
  function paint(){
    var diff=target.getTime()-Date.now();
    if(diff<=0){
      ids.d.textContent='00';ids.h.textContent='00';ids.m.textContent='00';ids.s.textContent='00';
      bar.style.width='100%';
      if(!wrap.classList.contains('done')){wrap.classList.add('done');label.textContent=(c.label||'Launch day')+' · done 🎉';}
      document.title='Done';
      return;
    }
    var s=Math.floor(diff/1000),dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;
    ids.d.textContent=dd>99?String(dd):pad(dd);ids.h.textContent=pad(hh);ids.m.textContent=pad(mm);ids.s.textContent=pad(ss);
    var pct=Math.min(100,Math.max(0,((Date.now()-startAt)/span)*100));
    bar.style.width=pct.toFixed(2)+'%';
    document.title=dd+'d '+pad(hh)+':'+pad(mm)+':'+pad(ss);
  }
  paint();setInterval(paint,1000);
})();
</script>
</body>
</html>
