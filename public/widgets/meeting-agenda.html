<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Meeting Agenda</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#6b6a68;--surface:#f7f7f5;--border:#e9e9e7;--accent:#2383e2;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}.wrap{height:100%;min-height:260px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:14px;font-weight:650;margin-top:2px}.summary{font-size:9px;color:var(--muted);text-align:right}.summary b{display:block;color:var(--accent-text);font-size:12px}.meta-form{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:5px}.meta-form input,.form input{min-width:0;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 7px;font:inherit;font-size:9.5px}.meta-form input:focus-visible,.form input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form{display:grid;grid-template-columns:minmax(0,1fr) 78px auto;gap:5px}.form button{height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 8px;cursor:pointer}.list{display:flex;min-height:55px;flex:1;flex-direction:column;gap:4px;overflow:auto}.row{display:grid;grid-template-columns:18px minmax(0,1fr) auto 23px;align-items:center;gap:6px;padding:5px 6px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.row input{width:14px;height:14px;margin:0;accent-color:var(--accent)}.topic{min-width:0;overflow-wrap:anywhere;font-size:10px}.row.done .topic{color:var(--muted);text-decoration:line-through}.time{font-size:9px;color:var(--accent-text);font-variant-numeric:tabular-nums;white-space:nowrap}.remove{width:22px;height:22px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.status,.note{font-size:9px;color:var(--muted);line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}.empty{text-align:center;padding:11px;color:var(--muted);font-size:10px}@media(max-width:340px){.wrap{padding:10px}.meta-form{grid-template-columns:minmax(0,1fr) 105px}.form{grid-template-columns:minmax(0,1fr) 72px auto}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Personal meeting prep</div><div class="title" id="title">Meeting agenda</div></div><div class="summary"><b id="minutesTotal">0m</b>planned</div></header>
  <section class="meta-form"><label class="sr-only" for="meeting">Meeting name</label><input id="meeting" maxlength="52" value="Meeting" placeholder="Meeting name" /><label class="sr-only" for="date">Meeting date</label><input id="date" type="date" /></section>
  <form class="form" id="form"><label class="sr-only" for="topic">Agenda point</label><input id="topic" maxlength="80" placeholder="Add an agenda point" required /><label class="sr-only" for="minutes">Minutes</label><input id="minutes" type="number" min="1" max="180" value="10" aria-label="Minutes" /><button type="submit">Add point</button></form>
  <section class="list" id="list" aria-label="Meeting agenda points"></section>
  <footer class="foot"><span class="status" id="status" aria-live="polite">Agenda stays in this browser. No attendee sync.</span><button class="clear" id="clear" type="button">Clear covered</button></footer>
  <div class="note">A personal agenda draft, not shared meeting notes, invitations, or a record of attendance.</div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(h){var s=String(h).slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function ratio(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function ink(h){var a=rgb(h);return ratio(a,[255,255,255])>=ratio(a,[0,0,0])?'#fff':'#000';}function textColor(h){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(h),to=dark?[255,255,255]:[0,0,0];if(ratio(a,bg)>=4.5)return h;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(ratio(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}function setText(){document.documentElement.style.setProperty('--accent-text',textColor(ACCENT));}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>=0?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#2383e2'),LABEL=String(c.label||'Meeting agenda').slice(0,48),KEY='blocksmith.meeting-agenda.v1',state={meeting:'Meeting',date:'',items:[]};
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',ink(ACCENT));setText();if(theme==='auto'&&window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',setText);else if(mq.addListener)mq.addListener(setText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;
  try{var a=JSON.parse(localStorage.getItem(KEY)||'null');if(a&&Array.isArray(a.items)){state.meeting=typeof a.meeting==='string'?a.meeting.slice(0,52):'Meeting';state.date=typeof a.date==='string'?a.date:'';state.items=a.items.filter(function(x){return x&&typeof x.topic==='string';}).slice(0,80);}}catch(e){}
  var meeting=document.getElementById('meeting'),date=document.getElementById('date'),list=document.getElementById('list'),status=document.getElementById('status');meeting.value=state.meeting;if(state.date)date.value=state.date;else{var d=new Date();date.value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}function save(msg){state.meeting=meeting.value.trim().slice(0,52)||'Meeting';state.date=date.value;try{localStorage.setItem(KEY,JSON.stringify(state));status.textContent=msg||'Agenda stays in this browser. No attendee sync.';}catch(e){status.textContent='Storage is unavailable in this browser session.';}}
  function render(){list.textContent='';var total=state.items.reduce(function(s,x){return s+Number(x.minutes||0);},0);document.getElementById('minutesTotal').textContent=total+'m';if(!state.items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Add a point to draft your meeting agenda.';list.appendChild(empty);return;}state.items.forEach(function(item,index){var row=document.createElement('div');row.className='row'+(item.done?' done':'');var check=document.createElement('input');check.type='checkbox';check.checked=!!item.done;check.setAttribute('aria-label',(item.done?'Mark not covered: ':'Mark covered: ')+item.topic);check.addEventListener('change',function(){item.done=check.checked;save();render();});var topic=document.createElement('span');topic.className='topic';topic.textContent=item.topic;var time=document.createElement('span');time.className='time';time.textContent=Number(item.minutes||0)+'m';var remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove agenda point: '+item.topic);remove.addEventListener('click',function(){state.items.splice(index,1);save();render();});row.append(check,topic,time,remove);list.appendChild(row);});}
  meeting.addEventListener('input',function(){save();});date.addEventListener('change',function(){save();});document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var topic=document.getElementById('topic').value.trim().slice(0,80),minutes=Math.max(1,Math.min(180,parseInt(document.getElementById('minutes').value,10)||10));if(!topic)return;if(state.items.length>=80){status.textContent='Agenda limit reached.';return;}state.items.push({topic:topic,minutes:minutes,done:false});document.getElementById('topic').value='';document.getElementById('minutes').value='10';save();render();document.getElementById('topic').focus();});document.getElementById('clear').addEventListener('click',function(){state.items=state.items.filter(function(x){return !x.done;});save('Covered points cleared.');render();});render();
})();
</script>
</body>
</html>
