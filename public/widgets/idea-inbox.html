<!doctype html>
<html lang="en" data-theme="auto">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Idea Inbox</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#6b6a68;--surface:#f7f7f5;--border:#e9e9e7;--accent:#9065b0;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{overflow:hidden;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrap{height:100%;min-height:275px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{margin-top:2px;font-size:14px;font-weight:650}.count{text-align:right;color:var(--muted);font-size:9px}.count b{display:block;color:var(--accent-text);font-size:12px}.form{display:grid;grid-template-columns:minmax(0,1fr) 115px;gap:5px}.form input,.form select,.form textarea{width:100%;min-width:0;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:5px 7px;font:inherit;font-size:9px}.form input,.form select{height:30px}.form textarea{min-height:43px;resize:vertical;line-height:1.35}.form input:focus-visible,.form select:focus-visible,.form textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form .idea-title{grid-column:1/2}.form .details{grid-column:1/3}.form button{grid-column:2;height:29px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 8px;cursor:pointer}.list{display:flex;flex:1;min-height:55px;flex-direction:column;gap:5px;overflow:auto}.entry{display:grid;grid-template-columns:minmax(0,1fr) 110px 22px;gap:4px 7px;padding:7px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.name{min-width:0;overflow-wrap:anywhere;font-size:10px;font-weight:650}.status{width:100%;height:23px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-size:8px;padding:2px}.details-text{grid-column:1/3;overflow-wrap:anywhere;color:var(--muted);font-size:9px;line-height:1.4}.remove{grid-column:3;grid-row:1/3;width:21px;height:21px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.empty{text-align:center;padding:12px;color:var(--muted);font-size:10px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.msg,.note{color:var(--muted);font-size:9px;line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}@media(max-width:340px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 95px}.entry{grid-template-columns:minmax(0,1fr) 95px 21px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head>
<body><main class="wrap"><header class="head"><div><div class="kicker">Capture first, sort later</div><div class="title" id="title">Idea inbox</div></div><div class="count"><b id="count">0</b>ideas</div></header>
<form class="form" id="form"><label class="sr-only" for="ideaTitle">Idea</label><input class="idea-title" id="ideaTitle" maxlength="72" placeholder="Idea title" required /><label class="sr-only" for="state">Idea status</label><select id="state"><option>New</option><option>Exploring</option><option>Parked</option></select><label class="sr-only" for="details">Extra context</label><textarea class="details" id="details" maxlength="360" placeholder="Extra context (optional)"></textarea><button type="submit">Capture idea</button></form>
<section class="list" id="list" aria-label="Ideas"></section><footer class="foot"><span class="msg" id="msg" aria-live="polite">Ideas stay in this browser; local storage is not encrypted.</span><button class="clear" id="clear" type="button">Clear inbox</button></footer><div class="note">A personal capture list, not a shared intake or prioritization system.</div></main>
<script>
(function(){var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(h){var s=h.slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function contrast(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function ink(h){var a=rgb(h);return contrast(a,[255,255,255])>=contrast(a,[0,0,0])?'#fff':'#000';}function textColor(h){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(h),to=dark?[255,255,255]:[0,0,0];if(contrast(a,bg)>=4.5)return h;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(contrast(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>=0?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#9065b0'),LABEL=String(c.label||'Idea inbox').slice(0,48),KEY='blocksmith.idea-inbox.v1',items=[];function setText(){document.documentElement.style.setProperty('--accent-text',textColor(ACCENT));}document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',ink(ACCENT));setText();if(theme==='auto'&&window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',setText);else if(mq.addListener)mq.addListener(setText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))items=a.filter(function(x){return x&&typeof x.title==='string';}).slice(0,100);}catch(e){}var list=document.getElementById('list'),msg=document.getElementById('msg');function save(text){try{localStorage.setItem(KEY,JSON.stringify(items));msg.textContent=text||'Ideas stay in this browser; local storage is not encrypted.';}catch(e){msg.textContent='Storage is unavailable in this browser session.';}}function render(){list.textContent='';document.getElementById('count').textContent=String(items.length);if(!items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Capture an idea to start the inbox.';list.appendChild(empty);return;}items.slice().reverse().forEach(function(item){var row=document.createElement('article');row.className='entry';var title=document.createElement('span');title.className='name';title.textContent=item.title;var select=document.createElement('select');select.className='status';select.setAttribute('aria-label','Status for '+item.title);['New','Exploring','Parked'].forEach(function(x){var o=document.createElement('option');o.value=x;o.textContent=x;select.appendChild(o);});select.value=['New','Exploring','Parked'].indexOf(item.state)>=0?item.state:'New';select.addEventListener('change',function(){item.state=select.value;save();});var details=document.createElement('div');details.className='details-text';details.textContent=item.details||'No extra context';var remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove idea: '+item.title);remove.addEventListener('click',function(){items.splice(items.indexOf(item),1);save();render();});row.append(title,select,details,remove);list.appendChild(row);});}document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var title=document.getElementById('ideaTitle').value.trim().slice(0,72),details=document.getElementById('details').value.trim().slice(0,360),state=document.getElementById('state').value;if(!title)return;if(items.length>=100){msg.textContent='Idea inbox limit reached.';return;}items.push({title:title,details:details,state:state});document.getElementById('ideaTitle').value='';document.getElementById('details').value='';document.getElementById('state').value='New';save();render();document.getElementById('ideaTitle').focus();});document.getElementById('clear').addEventListener('click',function(){items=[];save('Idea inbox cleared.');render();});render();})();
</script></body></html>
