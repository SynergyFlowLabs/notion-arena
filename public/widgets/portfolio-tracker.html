<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Manual Portfolio Tracker</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#6940a5;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}.wrap{height:100%;min-height:270px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:14px;font-weight:650;margin-top:2px}.summary{font-size:9px;color:var(--muted);text-align:right}.summary b{display:block;color:var(--accent-text);font-size:14px;font-variant-numeric:tabular-nums}.form{display:grid;grid-template-columns:minmax(0,1fr) 78px 88px auto;gap:5px}.form input{min-width:0;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 6px;font:inherit;font-size:9px}.form input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form button{height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}.form button:focus-visible,.remove:focus-visible,.clear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.list{display:flex;min-height:58px;flex:1;flex-direction:column;gap:4px;overflow:auto}.row{display:grid;grid-template-columns:minmax(0,1fr) auto 24px;gap:2px 7px;padding:6px 7px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.name{min-width:0;overflow-wrap:anywhere;font-size:10px;font-weight:600}.value{font-size:10px;color:var(--accent-text);font-variant-numeric:tabular-nums;white-space:nowrap}.detail{grid-column:1/3;font-size:8.5px;color:var(--muted)}.remove{grid-column:3;grid-row:1/3;width:23px;height:23px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.status,.note{font-size:9px;color:var(--muted);line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}.empty{text-align:center;padding:11px;color:var(--muted);font-size:10px}@media(max-width:370px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 74px}.form input:nth-of-type(1){grid-column:1/3}.form button{grid-column:1/3}.form input:nth-of-type(2),.form input:nth-of-type(3){grid-column:auto}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Manual holding values</div><div class="title" id="title">Portfolio tracker</div></div><div class="summary"><b id="total">$0.00</b>entered value</div></header>
  <form class="form" id="form"><label class="sr-only" for="name">Holding name</label><input id="name" maxlength="40" placeholder="Asset or holding" required /><label class="sr-only" for="units">Units</label><input id="units" type="number" min="0" max="100000000" step="0.0001" placeholder="Units" required /><label class="sr-only" for="price">Manual price per unit</label><input id="price" type="number" min="0" max="1000000000" step="0.01" placeholder="Price/unit" required /><button type="submit">Add</button></form>
  <section class="list" id="list" aria-label="Portfolio holdings"></section>
  <footer class="foot"><span class="status" id="status" aria-live="polite">Values save only in this browser. No live quotes.</span><button class="clear" id="clear" type="button">Clear holdings</button></footer>
  <div class="note">Manual arithmetic only. Prices are not refreshed; this is not investment advice.</div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(hex){var s=String(hex).slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function contrast(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function accentInk(hex){var a=rgb(hex);return contrast(a,[255,255,255])>=contrast(a,[0,0,0])?'#fff':'#000';}function accentText(hex){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(hex),to=dark?[255,255,255]:[0,0,0];if(contrast(a,bg)>=4.5)return hex;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(contrast(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}function setAccentText(){document.documentElement.style.setProperty('--accent-text',accentText(ACCENT));}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>-1?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#6940a5'),LABEL=String(c.label||'Portfolio tracker').slice(0,48),CURRENCY=String(c.currency||'$').slice(0,6),KEY='notion-arena.portfolio-tracker.v1',items=[];
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',accentInk(ACCENT));setAccentText();if(theme==='auto'&&window.matchMedia){var scheme=window.matchMedia('(prefers-color-scheme: dark)');if(scheme.addEventListener)scheme.addEventListener('change',setAccentText);else if(scheme.addListener)scheme.addListener(setAccentText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;
  try{var parsed=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(parsed))items=parsed.filter(function(x){return x&&typeof x.name==='string'&&isFinite(Number(x.units))&&isFinite(Number(x.price));}).slice(0,60);}catch(e){}
  var list=document.getElementById('list'),status=document.getElementById('status');function money(n){return CURRENCY+' '+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}function value(item){return Number(item.units||0)*Number(item.price||0);}function save(message){try{localStorage.setItem(KEY,JSON.stringify(items));status.textContent=message||'Values save only in this browser. No live quotes.';}catch(e){status.textContent='Storage is unavailable in this browser session.';}}
  function render(){list.textContent='';var total=items.reduce(function(s,x){return s+value(x);},0);document.getElementById('total').textContent=money(total);if(!items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Add manually valued holdings to see a total.';list.appendChild(empty);return;}items.forEach(function(item,index){var row=document.createElement('div');row.className='row';var name=document.createElement('span');name.className='name';name.textContent=item.name;var amount=document.createElement('span');amount.className='value';amount.textContent=money(value(item));var detail=document.createElement('span');detail.className='detail';detail.textContent=Number(item.units).toLocaleString()+' units × '+money(item.price)+' each, manually entered';var remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove '+item.name);remove.addEventListener('click',function(){items.splice(index,1);save();render();});row.append(name,amount,detail,remove);list.appendChild(row);});}
  document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var name=document.getElementById('name').value.trim().slice(0,40),units=Number(document.getElementById('units').value),price=Number(document.getElementById('price').value);if(!name||!isFinite(units)||!isFinite(price)||units<=0||price<0||units>100000000||price>1000000000)return;if(items.length>=60){status.textContent='Holding limit reached.';return;}items.push({name:name,units:units,price:price});document.getElementById('name').value='';document.getElementById('units').value='';document.getElementById('price').value='';save();render();document.getElementById('name').focus();});document.getElementById('clear').addEventListener('click',function(){items=[];save('Manual holdings cleared.');render();});render();
})();
</script>
</body>
</html>
