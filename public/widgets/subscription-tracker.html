<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Subscription Tracker</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#0f7b6c;--accent-ink:#fff;--accent-text:var(--accent)--danger:#c24136;--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{height:100%;min-height:270px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:13.5px;font-weight:650;margin-top:2px}.totals{display:flex;gap:8px}.total{font-size:9px;color:var(--muted);text-align:right}.total b{display:block;color:var(--accent-text);font-size:12px;font-variant-numeric:tabular-nums}.form{display:grid;grid-template-columns:minmax(0,1fr) 92px 82px;gap:5px}.form .name{grid-column:1/3}.form input,.form select{width:100%;min-width:0;height:29px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 6px;font:inherit;font-size:10px}.form button{height:29px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:10px;padding:4px 8px;cursor:pointer}.form input:focus-visible,.form select:focus-visible,.form button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.list{display:flex;min-height:52px;flex:1;flex-direction:column;gap:4px;overflow:auto}.row{display:grid;grid-template-columns:minmax(0,1fr) auto 25px;align-items:center;gap:4px 8px;padding:6px 7px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.nameText{min-width:0;overflow-wrap:anywhere;font-size:10.5px;font-weight:600}.meta{font-size:9px;color:var(--muted)}.price{font-size:10px;font-variant-numeric:tabular-nums;text-align:right}.remove{grid-column:3;grid-row:1/3;width:25px;height:25px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9px;color:var(--muted)}.empty{text-align:center;padding:11px;color:var(--muted);font-size:10px}.clear{border:0;background:transparent;color:var(--muted);font:inherit;font-size:9px;text-decoration:underline;cursor:pointer}
@media(max-width:340px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 72px 72px;gap:4px}.form input,.form select{font-size:9px}.row{gap:4px 5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Manual recurring costs</div><div class="title" id="title">Subscriptions</div></div><div class="totals"><div class="total">Monthly equivalent<b id="monthly">$0</b></div><div class="total">Annual estimate<b id="annual">$0</b></div></div></header>
  <form class="form" id="form"><label class="sr-only" for="name">Subscription name</label><input class="name" id="name" maxlength="60" placeholder="Subscription name" required /><label class="sr-only" for="cost">Cost</label><input id="cost" type="number" min="0" max="10000000" step="0.01" placeholder="Amount" required /><select id="cadence" aria-label="Billing frequency"><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select><label class="sr-only" for="renewal">Next renewal date</label><input id="renewal" type="date" aria-label="Next renewal date, optional" /><button type="submit">Add</button></form>
  <section class="list" id="list" aria-label="Subscriptions"></section>
  <div class="foot"><span id="status" aria-live="polite">Entries save only in this browser. Estimates use the amounts you enter.</span><button class="clear" id="clear" type="button">Clear all</button></div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}
  function rgb(hex){var s=String(hex).slice(1);return [0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}
  function luminance(values){return values.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(a,v,i){return a+v*[.2126,.7152,.0722][i];},0);}
  function contrast(a,b){var x=luminance(a),y=luminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
  function accentInk(hex){var c=rgb(hex);return contrast(c,[255,255,255])>=contrast(c,[0,0,0])?'#fff':'#000';}
  function accentText(hex){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),base=rgb(hex),target=dark?[255,255,255]:[0,0,0];if(contrast(base,bg)>=4.5)return hex;for(var t=.02;t<=1;t+=.02){var mix=base.map(function(v,i){return Math.round(v+(target[i]-v)*t);});if(contrast(mix,bg)>=4.5)return '#'+mix.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}
  function setAccentText(){document.documentElement.style.setProperty('--accent-text',accentText(ACCENT));}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>-1?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#0f7b6c'),LABEL=String(c.label||'Subscriptions').slice(0,48),CURRENCY=String(c.currency||'$').slice(0,6),defaults=[];
  String(c.items||'').split('||').slice(0,30).forEach(function(row){var p=row.split('::'),name=(p[0]||'').trim(),cost=parseFloat(p[1]),cadence=p[2]==='yearly'?'yearly':'monthly',renewal=String(p[3]||'').slice(0,10);if(name&&isFinite(cost)&&cost>=0)defaults.push({name:name.slice(0,60),cost:Math.min(cost,1e7),cadence:cadence,renewal:/^\d{4}-\d{2}-\d{2}$/.test(renewal)?renewal:''});});
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',accentInk(ACCENT));setAccentText();if(theme==='auto'&&window.matchMedia){var scheme=window.matchMedia('(prefers-color-scheme: dark)');if(scheme.addEventListener)scheme.addEventListener('change',setAccentText);else if(scheme.addListener)scheme.addListener(setAccentText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;
  function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return 's'+(h>>>0).toString(36);}
  var id=hash(LABEL),KEY='notion-arena.subscription-tracker.v1',store={lists:{}},items=defaults.slice();
  try{var saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved&&saved.lists)store=saved;if(store.lists&&Array.isArray(store.lists[id]))items=store.lists[id].filter(function(x){return x&&typeof x.name==='string';}).slice(0,30).map(function(x){return{name:String(x.name).slice(0,60),cost:Math.max(0,Math.min(1e7,parseFloat(x.cost)||0)),cadence:x.cadence==='yearly'?'yearly':'monthly',renewal:/^\d{4}-\d{2}-\d{2}$/.test(String(x.renewal||''))?x.renewal:''};});}catch(e){}
  function save(){if(!store.lists)store.lists={};store.lists[id]=items;var keys=Object.keys(store.lists);while(keys.length>8){var old=keys.shift();if(old===id){keys.push(old);continue;}delete store.lists[old];}try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
  function money(v){return CURRENCY+' '+Number(v).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});}
  function render(){var list=document.getElementById('list');while(list.firstChild)list.removeChild(list.firstChild);var month=0;items.forEach(function(item,index){month+=item.cost/(item.cadence==='yearly'?12:1);var row=document.createElement('div'),name=document.createElement('div'),meta=document.createElement('div'),price=document.createElement('div'),remove=document.createElement('button');row.className='row';name.className='nameText';name.textContent=item.name;meta.className='meta';meta.textContent=(item.cadence==='yearly'?'Yearly':'Monthly')+(item.renewal?' · renews '+item.renewal:'');price.className='price';price.textContent=money(item.cost)+' / '+(item.cadence==='yearly'?'yr':'mo');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove '+item.name);remove.addEventListener('click',function(){items.splice(index,1);save();render();});row.appendChild(name);row.appendChild(price);row.appendChild(meta);row.appendChild(remove);list.appendChild(row);});document.getElementById('monthly').textContent=money(month);document.getElementById('annual').textContent=money(month*12);document.getElementById('status').textContent='Entries save only in this browser. Totals are estimates, not account data.';if(!items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='No subscriptions yet. Add one above.';list.appendChild(empty);}}
  document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var name=document.getElementById('name').value.trim(),cost=parseFloat(document.getElementById('cost').value);if(!name||!isFinite(cost)||cost<0)return;if(items.length>=30){document.getElementById('status').textContent='List limit reached.';return;}items.unshift({name:name.slice(0,60),cost:Math.min(cost,1e7),cadence:document.getElementById('cadence').value,renewal:document.getElementById('renewal').value});document.getElementById('name').value='';document.getElementById('cost').value='';document.getElementById('renewal').value='';save();render();});
  document.getElementById('clear').addEventListener('click',function(){items=[];save();render();});render();save();
})();
</script>
</body>
</html>
