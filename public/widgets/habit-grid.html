<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Habit Heatmap</title>
<style>
:root{--bg:#ffffff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#0f7b6c;--cell:#ebedef;
--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#2f2f2f;--cell:#2a2a2a}
@media (prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#2f2f2f;--cell:#2a2a2a}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;gap:8px;padding:12px 14px;overflow:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.title{font-size:13px;font-weight:600;letter-spacing:-.01em}
.tools{display:flex;gap:6px;align-items:center}
button{font:inherit;font-size:11.5px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--muted);
border-radius:7px;padding:3px 8px;cursor:pointer}
button:hover{color:var(--fg);border-color:color-mix(in oklab,var(--fg) 20%,var(--border))}
.block{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:9px 10px}
.hrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hname{font-size:12.5px;font-weight:600;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:1px 7px;background:var(--bg);white-space:nowrap}
.pill.hot{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 40%,var(--border))}
.grid{display:flex;gap:2px;overflow-x:auto;padding-bottom:2px}
.col{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.cell{width:11px;height:11px;border-radius:2.5px;background:var(--cell);cursor:pointer;transition:transform .08s}
.cell:hover{transform:scale(1.22)}
.cell.l1{background:color-mix(in oklab,var(--accent) 30%,var(--cell))}
.cell.l2{background:color-mix(in oklab,var(--accent) 55%,var(--cell))}
.cell.l3{background:var(--accent)}
.cell.future{opacity:.35;cursor:default}
.months{display:flex;gap:2px;margin-bottom:4px}
.months span{font-size:9.5px;color:var(--muted);flex:0 0 auto}
.legend{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);margin-top:2px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.empty{color:var(--muted);font-size:12px;padding:20px;text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="title" id="title">Habits</div>
    <div class="tools">
      <button id="export" title="Copy your grid as JSON">Export</button>
      <button id="clear" title="Erase all logged days">Clear</button>
    </div>
  </div>
  <div id="body"></div>
  <div class="legend">
    <span>less</span>
    <i style="background:var(--cell)"></i>
    <i style="background:color-mix(in oklab,var(--accent) 30%,var(--cell))"></i>
    <i style="background:color-mix(in oklab,var(--accent) 55%,var(--cell))"></i>
    <i style="background:var(--accent)"></i>
    <span>more</span>
    <span style="margin-left:8px">· click a cell to log, click again to raise intensity</span>
  </div>
</div>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};
  try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];
  q.forEach(function(v,k){c[k]=v;});
  function num(k,d){var v=parseInt(c[k],10);return isFinite(v)?v:d;}

  var ACCENT=c.accent||'#0f7b6c';
  if(c.theme)document.documentElement.setAttribute('data-theme',c.theme);
  document.documentElement.style.setProperty('--accent',ACCENT);

  var habits=(c.habits||'Read,Move,Write,No screens,Sleep 8h').split(',').map(function(s){return s.trim();}).filter(Boolean).slice(0,6);
  var WEEKS=Math.max(4,Math.min(52,num('weeks',20)));
  var KEY='blocksmith.habits.v1';
  var data={};
  try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){data={};}

  var body=document.getElementById('body');
  if(!habits.length){body.innerHTML='<div class="empty">No habits configured.</div>';return;}
  document.getElementById('title').textContent=c.title||'Habits · last '+WEEKS+' weeks';

  function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
  var today=startOfDay(new Date());
  var end=today;
  while(end.getDay()!==6)end=new Date(end.getTime()+864e5);
  var start=new Date(end.getTime()-(WEEKS*7-1)*864e5);

  function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
  function streaks(h){
    var cur=0,best=0,total=0,run=0;
    var d=new Date(start);
    while(d<=end){
      var k=iso(d),v=(data[h]||{})[k]||0;
      if(v>0){run++;total++;if(run>best)best=run;}else{run=0;}
      if(d<=today){}
      d=new Date(d.getTime()+864e5);
    }
    var t=new Date(today);
    var guard=0;
    while(guard<400){
      var kk=iso(t),vv=(data[h]||{})[kk]||0;
      if(vv>0){cur++;}else{if(guard>0||vv===0){break;}}
      t=new Date(t.getTime()-864e5);guard++;
      if(cur===0&&guard>1)break;
    }
    return {cur:cur,best:best,rate:Math.round((total/(WEEKS*7))*100)};
  }
  function render(){
    body.innerHTML='';
    habits.forEach(function(h){
      var st=streaks(h);
      var blk=document.createElement('div');blk.className='block';
      var row=document.createElement('div');row.className='hrow';
      row.innerHTML='<span class="hname">'+h.replace(/[<>&]/g,'')+'</span>'+
        '<span class="pill'+(st.cur>=3?' hot':'')+'">🔥 '+st.cur+'d</span>'+
        '<span class="pill">best '+st.best+'d</span>'+
        '<span class="pill">'+st.rate+'%</span>';
      blk.appendChild(row);
      var months=document.createElement('div');months.className='months';
      var grid=document.createElement('div');grid.className='grid';
      var rec=data[h]||(data[h]={});
      var d=new Date(start),lastMonth=-1,weekCount=0;
      while(d<=end){
        var col=document.createElement('div');col.className='col';
        var lbl=document.createElement('span');
        var m=d.getMonth();
        lbl.textContent=(m!==lastMonth&&d.getDate()<=7)?d.toLocaleDateString(undefined,{month:'short'}):'';
        lastMonth=m;
        months.appendChild(lbl);
        for(var i=0;i<7;i++){
          var cd=new Date(d.getTime()+i*864e5);
          var cell=document.createElement('div');
          var future=cd>today;
          cell.className='cell'+(future?' future':'');
          var key=iso(cd),v=rec[key]||0;
          if(v>0)cell.classList.add('l'+Math.min(3,v));
          cell.title=cd.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+(v?v+'/3':'not logged');
          if(!future){
            (function(hh,kk,el){
              el.addEventListener('click',function(){
                var cur=(data[hh]||{})[kk]||0;
                var nx=cur>=3?0:cur+1;
                if(!data[hh])data[hh]={};
                if(nx===0)delete data[hh][kk];else data[hh][kk]=nx;
                save();render();
              });
            })(h,key,cell);
          }
          col.appendChild(cell);
        }
        grid.appendChild(col);weekCount++;
        d=new Date(d.getTime()+7*864e5);
      }
      blk.appendChild(months);blk.appendChild(grid);body.appendChild(blk);
    });
  }
  document.getElementById('export').addEventListener('click',function(e){
    var txt=JSON.stringify(data,null,2);
    var btn=e.currentTarget;
    function done(t){btn.textContent=t;setTimeout(function(){btn.textContent='Export';},1400);}
    try{navigator.clipboard.writeText(txt).then(function(){done('Copied ✓');},function(){done('See console');});}catch(err){done('See console');}
    try{console.log(txt);}catch(err){}
  });
  document.getElementById('clear').addEventListener('click',function(){
    if(!confirm('Erase every logged day on this device?'))return;
    data={};save();render();
  });
  render();
})();
</script>
</body>
</html>
