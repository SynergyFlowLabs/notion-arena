<!doctype html>
<html lang="en" data-theme="auto">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Protocol Checklist</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#6b6a68;--surface:#f7f7f5;--border:#e9e9e7;--accent:#d9730d;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{overflow:hidden;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrap{height:100%;min-height:260px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{margin-top:2px;font-size:14px;font-weight:650}.summary{text-align:right;color:var(--muted);font-size:9px}.summary b{display:block;color:var(--accent-text);font-size:12px}.meta input,.form input{min-width:0;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 7px;font:inherit;font-size:9px}.meta input{width:100%}.meta input:focus-visible,.form input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px}.form button{height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 8px;cursor:pointer}.list{display:flex;flex:1;min-height:55px;flex-direction:column;gap:4px;overflow:auto}.row{display:grid;grid-template-columns:17px minmax(0,1fr) 22px;align-items:center;gap:7px;padding:5px 6px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.row input{width:14px;height:14px;margin:0;accent-color:var(--accent)}.step{min-width:0;overflow-wrap:anywhere;font-size:9.5px}.row.done .step{color:var(--muted);text-decoration:line-through}.remove{width:21px;height:21px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.empty{text-align:center;padding:12px;color:var(--muted);font-size:10px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.status,.note{color:var(--muted);font-size:9px;line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}@media(max-width:340px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 70px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head>
<body><main class="wrap"><header class="head"><div><div class="kicker">Your steps, your checklist</div><div class="title" id="title">Protocol checklist</div></div><div class="summary"><b id="progress">0 / 0</b>complete</div></header>
<div class="meta"><label class="sr-only" for="protocol">Checklist title</label><input id="protocol" maxlength="56" value="Protocol" placeholder="Checklist title" /></div><form class="form" id="form"><label class="sr-only" for="step">Checklist step</label><input id="step" maxlength="90" placeholder="Add a step" required /><button type="submit">Add step</button></form>
<section class="list" id="list" aria-label="Protocol steps"></section><footer class="foot"><span class="status" id="status" aria-live="polite">Steps save only in this browser.</span><button class="clear" id="clear" type="button">Clear completed</button></footer><div class="note">Local steps are not encrypted or validated as a safety or compliance protocol.</div></main>
<script>
(function(){var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(h){var s=h.slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function contrast(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function ink(h){var a=rgb(h);return contrast(a,[255,255,255])>=contrast(a,[0,0,0])?'#fff':'#000';}function textColor(h){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(h),to=dark?[255,255,255]:[0,0,0];if(contrast(a,bg)>=4.5)return h;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(contrast(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>=0?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#d9730d'),LABEL=String(c.label||'Protocol checklist').slice(0,48),KEY='blocksmith.protocol-checklist.v1',state={title:'Protocol',steps:[]};function setText(){document.documentElement.style.setProperty('--accent-text',textColor(ACCENT));}document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',ink(ACCENT));setText();if(theme==='auto'&&window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',setText);else if(mq.addListener)mq.addListener(setText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;try{var a=JSON.parse(localStorage.getItem(KEY)||'null');if(a&&Array.isArray(a.steps)){state.title=typeof a.title==='string'?a.title.slice(0,56):'Protocol';state.steps=a.steps.filter(function(x){return x&&typeof x.text==='string';}).slice(0,100);}}catch(e){}var title=document.getElementById('protocol'),list=document.getElementById('list'),status=document.getElementById('status');title.value=state.title;function save(msg){state.title=title.value.trim().slice(0,56)||'Protocol';try{localStorage.setItem(KEY,JSON.stringify(state));status.textContent=msg||'Steps save only in this browser.';}catch(e){status.textContent='Storage is unavailable in this browser session.';}}function render(){list.textContent='';var done=state.steps.filter(function(x){return !!x.done;}).length;document.getElementById('progress').textContent=done+' / '+state.steps.length;if(!state.steps.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Add your own steps to make a reusable checklist.';list.appendChild(empty);return;}state.steps.forEach(function(item){var row=document.createElement('div');row.className='row'+(item.done?' done':'');var check=document.createElement('input');check.type='checkbox';check.checked=!!item.done;check.setAttribute('aria-label',(item.done?'Mark incomplete: ':'Mark complete: ')+item.text);check.addEventListener('change',function(){item.done=check.checked;save();render();});var text=document.createElement('span');text.className='step';text.textContent=item.text;var remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove step: '+item.text);remove.addEventListener('click',function(){state.steps.splice(state.steps.indexOf(item),1);save();render();});row.append(check,text,remove);list.appendChild(row);});}title.addEventListener('input',function(){save();});document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var text=document.getElementById('step').value.trim().slice(0,90);if(!text)return;if(state.steps.length>=100){status.textContent='Checklist limit reached.';return;}state.steps.push({text:text,done:false});document.getElementById('step').value='';save();render();document.getElementById('step').focus();});document.getElementById('clear').addEventListener('click',function(){state.steps=state.steps.filter(function(x){return !x.done;});save('Completed steps cleared.');render();});render();})();
</script></body></html>
