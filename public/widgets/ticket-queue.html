<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Local Ticket Queue</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#2383e2;--danger:#c24136;--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{height:100%;min-height:240px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:13.5px;font-weight:650;margin-top:2px}.count{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.form{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:5px}.form input,.form select{min-width:0;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 6px;font:inherit;font-size:10px}.form input:focus-visible,.form select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form button{height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:#fff;font:inherit;font-size:10px;padding:4px 8px;cursor:pointer}.list{display:flex;min-height:62px;flex:1;flex-direction:column;gap:4px;overflow:auto}.ticket{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:7px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.ticket-title{min-width:0;overflow-wrap:anywhere;font-size:10.5px;font-weight:600}.priority{font-size:9px;color:var(--muted);white-space:nowrap}.ticket select{max-width:120px;height:25px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);padding:2px 5px;font:inherit;font-size:9px}.remove{height:25px;border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:10px;padding:3px 6px;cursor:pointer}.remove:hover{color:var(--danger)}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9px;color:var(--muted)}.empty{padding:12px;text-align:center;color:var(--muted);font-size:10px}
@media(max-width:340px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 72px auto;gap:3px}.form input,.form select{font-size:9px}.ticket{gap:3px 5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Local support queue</div><div class="title" id="title">Ticket queue</div></div><div class="count" id="count">0 open</div></header>
  <form class="form" id="form"><label class="sr-only" for="newTicket">Ticket title</label><input id="newTicket" maxlength="100" placeholder="Add a request" required /><select id="priority" aria-label="New ticket priority"><option>Normal</option><option>High</option><option>Low</option></select><button type="submit">Add</button></form>
  <section class="list" id="list" aria-label="Support tickets"></section>
  <div class="foot"><span id="status" aria-live="polite">Queue data saves only in this browser.</span><button class="remove" id="clear" type="button">Clear closed</button></div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>-1?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#2383e2'),LABEL=String(c.label||'Ticket queue').slice(0,48);
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.getElementById('title').textContent=LABEL;document.title=LABEL;
  function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return 't'+(h>>>0).toString(36);}
  var id=hash(LABEL),KEY='blocksmith.ticket-queue.v1',store={queues:{}},tickets=[];
  try{var saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved&&saved.queues)store=saved;if(store.queues&&Array.isArray(store.queues[id]))tickets=store.queues[id].filter(function(x){return x&&typeof x.title==='string';}).slice(0,50);}catch(e){}
  function save(){if(!store.queues)store.queues={};store.queues[id]=tickets;var ids=Object.keys(store.queues);while(ids.length>8){var old=ids.shift();if(old===id){ids.push(old);continue;}delete store.queues[old];}try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
  function render(){var list=document.getElementById('list');while(list.firstChild)list.removeChild(list.firstChild);var open=0;tickets.forEach(function(ticket,index){if(ticket.status!=='Closed')open++;var card=document.createElement('div'),title=document.createElement('div'),priority=document.createElement('div'),select=document.createElement('select'),remove=document.createElement('button');card.className='ticket';title.className='ticket-title';title.textContent=ticket.title;priority.className='priority';priority.textContent=ticket.priority+' priority';['Open','Working','Blocked','Closed'].forEach(function(value){var opt=document.createElement('option');opt.value=value;opt.textContent=value;if(ticket.status===value)opt.selected=true;select.appendChild(opt);});select.setAttribute('aria-label','Status for '+ticket.title);select.addEventListener('change',function(){ticket.status=select.value;save();render();});remove.className='remove';remove.type='button';remove.textContent='Remove';remove.setAttribute('aria-label','Remove '+ticket.title);remove.addEventListener('click',function(){tickets.splice(index,1);save();render();});card.appendChild(title);card.appendChild(priority);card.appendChild(select);card.appendChild(remove);list.appendChild(card);});document.getElementById('count').textContent=open+' open';document.getElementById('status').textContent='Local queue only. Nothing is sent or shared.';if(!tickets.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='No tickets yet. Add a request above.';list.appendChild(empty);}}
  document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var input=document.getElementById('newTicket'),title=input.value.trim();if(!title)return;if(tickets.length>=50){document.getElementById('status').textContent='Queue limit reached.';return;}tickets.unshift({title:title.slice(0,100),priority:document.getElementById('priority').value,status:'Open',createdAt:new Date().toISOString()});input.value='';save();render();});
  document.getElementById('clear').addEventListener('click',function(){tickets=tickets.filter(function(x){return x.status!=='Closed';});save();render();});
  render();save();
})();
</script>
</body>
</html>
