<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Home Maintenance Log</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#d9730d;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}.wrap{height:100%;min-height:250px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:14px;font-weight:650;margin-top:2px}.summary{font-size:9px;color:var(--muted);text-align:right}.summary b{display:block;color:var(--accent-text);font-size:12px}.form{display:grid;grid-template-columns:minmax(0,1fr) 105px 112px auto;gap:5px}.form input{min-width:0;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 6px;font:inherit;font-size:9.5px}.form input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form button{height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}.form button:focus-visible,.foot button:focus-visible,.remove:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.list{display:flex;min-height:60px;flex:1;flex-direction:column;gap:4px;overflow:auto}.row{display:grid;grid-template-columns:17px minmax(0,1fr) auto 24px;align-items:center;gap:5px 7px;padding:5px 6px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.row input{grid-row:1/3;width:14px;height:14px;margin:0;accent-color:var(--accent)}.task{min-width:0;overflow-wrap:anywhere;font-size:10px;font-weight:600}.due{font-size:9px;color:var(--accent-text);white-space:nowrap}.area{grid-column:2/4;font-size:9px;color:var(--muted)}.row.done .task{text-decoration:line-through;color:var(--muted)}.remove{grid-column:4;grid-row:1/3;width:23px;height:23px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.status{font-size:9px;color:var(--muted)}.foot button{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}.foot button:hover{border-color:var(--accent)}.empty{text-align:center;padding:11px;color:var(--muted);font-size:10px}@media(max-width:360px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.form input:last-of-type{grid-column:1/3}.form button{grid-column:1/3}.row{grid-template-columns:17px minmax(0,1fr) auto 23px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Household record</div><div class="title" id="title">Home maintenance</div></div><div class="summary"><b id="open">0</b>open items</div></header>
  <form class="form" id="form"><label class="sr-only" for="task">Maintenance task</label><input id="task" maxlength="60" placeholder="Task" required /><label class="sr-only" for="due">Due date</label><input id="due" type="date" /><label class="sr-only" for="area">Area</label><input id="area" maxlength="36" placeholder="Area (optional)" /><button type="submit">Add</button></form>
  <section class="list" id="list" aria-label="Home maintenance items"></section>
  <footer class="foot"><span class="status" id="status" aria-live="polite">Saved only in this browser. No contractor sync.</span><button id="clear" type="button">Clear completed</button></footer>
  <div class="status">Personal record only. It does not assess safety or replace qualified maintenance advice.</div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(hex){var s=String(hex).slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function contrast(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function accentInk(hex){var a=rgb(hex);return contrast(a,[255,255,255])>=contrast(a,[0,0,0])?'#fff':'#000';}function accentText(hex){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(hex),to=dark?[255,255,255]:[0,0,0];if(contrast(a,bg)>=4.5)return hex;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(contrast(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}function setAccentText(){document.documentElement.style.setProperty('--accent-text',accentText(ACCENT));}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>-1?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#d9730d'),LABEL=String(c.label||'Home maintenance').slice(0,48),KEY='notion-arena.home-maintenance-log.v1',items=[];
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',accentInk(ACCENT));setAccentText();if(theme==='auto'&&window.matchMedia){var scheme=window.matchMedia('(prefers-color-scheme: dark)');if(scheme.addEventListener)scheme.addEventListener('change',setAccentText);else if(scheme.addListener)scheme.addListener(setAccentText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;
  try{var parsed=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(parsed))items=parsed.filter(function(x){return x&&typeof x.task==='string';}).slice(0,80);}catch(e){}
  var list=document.getElementById('list'),status=document.getElementById('status');function save(message){try{localStorage.setItem(KEY,JSON.stringify(items));status.textContent=message||'Saved only in this browser. No contractor sync.';}catch(e){status.textContent='Storage is unavailable in this browser session.';}}
  function showDate(value){if(!value)return'No due date';var d=new Date(value+'T00:00:00');return isNaN(d.getTime())?value:new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(d);}
  function render(){list.textContent='';document.getElementById('open').textContent=String(items.filter(function(x){return !x.done;}).length);if(!items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Add a maintenance item to begin your record.';list.appendChild(empty);return;}items.slice().sort(function(a,b){if(!!a.done!==!!b.done)return a.done?1:-1;return(a.due||'9999').localeCompare(b.due||'9999');}).forEach(function(item){var index=items.indexOf(item),row=document.createElement('div');row.className='row'+(item.done?' done':'');var check=document.createElement('input');check.type='checkbox';check.checked=!!item.done;check.setAttribute('aria-label',(item.done?'Reopen: ':'Complete: ')+item.task);check.addEventListener('change',function(){item.done=check.checked;save();render();});var task=document.createElement('span');task.className='task';task.textContent=item.task;var due=document.createElement('span');due.className='due';due.textContent=showDate(item.due);var area=document.createElement('span');area.className='area';area.textContent=item.area||'Home';var remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove '+item.task);remove.addEventListener('click',function(){items.splice(index,1);save();render();});row.append(check,task,due,area,remove);list.appendChild(row);});}
  document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var task=document.getElementById('task').value.trim().slice(0,60),due=document.getElementById('due').value,area=document.getElementById('area').value.trim().slice(0,36);if(!task)return;if(items.length>=80){status.textContent='List limit reached.';return;}items.push({task:task,due:due,area:area,done:false});document.getElementById('task').value='';document.getElementById('due').value='';document.getElementById('area').value='';save();render();document.getElementById('task').focus();});document.getElementById('clear').addEventListener('click',function(){items=items.filter(function(x){return !x.done;});save('Completed items cleared.');render();});render();
})();
</script>
</body>
</html>
