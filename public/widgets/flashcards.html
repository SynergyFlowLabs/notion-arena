<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flashcards</title>
<style>
:root{--bg:#ffffff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#0075de;--track:#e9e9e7;--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--track:#343434}
@media (prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--track:#343434}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{height:100%;min-height:220px;display:flex;flex-direction:column;gap:10px;padding:14px;overflow:auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kicker{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:650}
.title{margin-top:2px;font-size:14px;font-weight:650;letter-spacing:-.02em}
.counter{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress{height:5px;width:100%;overflow:hidden;border-radius:99px;background:var(--track)}
.progress i{display:block;height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .2s ease}
.stage{display:flex;flex:1;min-height:120px;align-items:stretch}
.card{position:relative;display:flex;width:100%;min-height:126px;flex-direction:column;align-items:stretch;justify-content:center;gap:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--fg);padding:16px 18px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.card:hover{border-color:color-mix(in oklab,var(--accent) 48%,var(--border))}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.complete{align-items:center;text-align:center;background:color-mix(in oklab,var(--accent) 8%,var(--surface))}
.side{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700}
.prompt{font-size:16px;font-weight:550;line-height:1.5;letter-spacing:-.01em;overflow-wrap:anywhere}
.helper{font-size:10.5px;color:var(--muted)}
.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
button{min-height:30px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);font:inherit;font-size:11.5px;font-weight:550;padding:5px 10px;cursor:pointer;transition:border-color .15s,opacity .15s}
button:hover{border-color:color-mix(in oklab,var(--accent) 45%,var(--border))}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{border-color:var(--accent);background:var(--accent);color:#fff}
button.primary:hover{filter:brightness(.94)}
button.again{color:var(--muted)}
.spacer{flex:1}
.stats{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.status{min-height:14px;font-size:10.5px;color:var(--muted)}
@media(max-width:360px){.wrap{padding:11px}.card{padding:13px}.prompt{font-size:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div><div class="kicker">Active recall</div><div class="title" id="title">Quick Review</div></div>
    <div class="counter" id="counter">Card 1 of 4</div>
  </header>
  <div class="progress" id="progress" role="progressbar" aria-label="Deck progress" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><i id="fill"></i></div>
  <main class="stage">
    <button class="card" id="card" type="button" aria-expanded="false">
      <span class="side" id="side">Question</span>
      <span class="prompt" id="prompt">Loading card</span>
      <span class="helper" id="helper">Select to reveal the answer</span>
    </button>
  </main>
  <div class="controls">
    <button id="previous" type="button" aria-label="Previous card">Previous</button>
    <button id="next" type="button" aria-label="Next card">Next</button>
    <span class="spacer"></span>
    <button class="again" id="again" type="button" disabled>Review again</button>
    <button class="primary" id="know" type="button" disabled>I know this</button>
    <button id="restart" type="button">Review all</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="status" id="status" aria-live="polite">Tap a card to reveal the answer.</div>
</div>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};
  try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];
  q.forEach(function(v,k){c[k]=v;});
  function bool(k,d){var v=c[k];return v===undefined?d:(v===true||v==='true'||v==='1');}
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>-1?String(c.theme||'auto'):'auto';
  var ACCENT=safeColor(c.accent,'#0075de');
  var DECK=String(c.deck||'Quick Review').slice(0,50);
  var raw=String(c.cards||'');
  var DEFAULT=[
    {front:'What are Notion pages built from?',back:'Blocks. Text, headings, embeds, database views, and other content are all blocks.'},
    {front:'What does a database relation connect?',back:'Records in separate databases, so related information can be viewed together.'},
    {front:'What is active recall?',back:'Trying to retrieve an idea from memory before looking at the answer.'},
    {front:'What makes a useful study card?',back:'One clear prompt with one focused answer, not a whole page of notes.'}
  ];
  var cards=[];
  if(raw){
    raw.split('||').forEach(function(entry){
      var cut=entry.indexOf('::');
      if(cut<0)return;
      var front=entry.slice(0,cut).trim(),back=entry.slice(cut+2).trim();
      if(front&&back)cards.push({front:front,back:back});
    });
  }
  if(!cards.length)cards=DEFAULT.slice(0);
  cards=cards.slice(0,100);
  var SHUFFLE=bool('shuffle',false);
  if(theme)document.documentElement.setAttribute('data-theme',theme);
  document.documentElement.style.setProperty('--accent',ACCENT);
  document.getElementById('title').textContent=DECK;
  document.title=DECK;

  var KEY='blocksmith.flashcards.v1';
  function fingerprint(value){var h=5381;for(var i=0;i<value.length;i++)h=((h<<5)-h+value.charCodeAt(i))|0;return 'd'+(h>>>0).toString(36);}
  var deckId=fingerprint(DECK+'\n'+cards.map(function(card){return card.front+'\n'+card.back;}).join('\n'));
  var store={version:1,decks:{}};
  try{var saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved&&saved.decks&&typeof saved.decks==='object')store=saved;}catch(e){}
  var state=store.decks[deckId];
  function makeOrder(){
    var out=[];for(var i=0;i<cards.length;i++)out.push(i);
    if(SHUFFLE){
      var seed=parseInt(deckId.slice(1),36)||1;
      function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
      for(var j=out.length-1;j>0;j--){var pick=Math.floor(random()*(j+1)),tmp=out[j];out[j]=out[pick];out[pick]=tmp;}
    }
    return out;
  }
  if(!state||typeof state!=='object')state={index:0,known:[],again:0,order:makeOrder()};
  function validOrder(order){
    if(!Array.isArray(order)||order.length!==cards.length)return false;
    var seen=[];
    for(var i=0;i<order.length;i++){
      if(!Number.isInteger(order[i])||order[i]<0||order[i]>=cards.length||seen.indexOf(order[i])>=0)return false;
      seen.push(order[i]);
    }
    return true;
  }
  if(!validOrder(state.order)||state.shuffle!==SHUFFLE)state.order=makeOrder();
  state.shuffle=SHUFFLE;
  if(!Array.isArray(state.known))state.known=[];
  var knownSeen=[];
  state.known=state.known.filter(function(n){
    if(!Number.isInteger(n)||n<0||n>=cards.length||knownSeen.indexOf(n)>=0)return false;
    knownSeen.push(n);return true;
  });
  state.again=Math.max(0,parseInt(state.again,10)||0);
  state.index=Math.max(0,Math.min(cards.length-1,parseInt(state.index,10)||0));
  var revealed=false;
  var cardButton=document.getElementById('card'),side=document.getElementById('side'),prompt=document.getElementById('prompt');
  var helper=document.getElementById('helper'),counter=document.getElementById('counter'),fill=document.getElementById('fill');
  var progress=document.getElementById('progress'),stats=document.getElementById('stats'),statusEl=document.getElementById('status');
  progress.setAttribute('aria-valuemax',String(cards.length));
  var againButton=document.getElementById('again'),knowButton=document.getElementById('know'),previousButton=document.getElementById('previous'),nextButton=document.getElementById('next');
  function save(){
    store.decks[deckId]=state;
    var ids=Object.keys(store.decks);
    while(ids.length>8){var old=ids.shift();if(old!==deckId)delete store.decks[old];}
    try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}
  }
  function currentOriginalIndex(){return state.order[state.index];}
  function countKnown(){return state.known.length;}
  function nextUnlearned(from){
    for(var step=1;step<=cards.length;step++){
      var pos=(from+step)%cards.length,original=state.order[pos];
      if(state.known.indexOf(original)<0)return pos;
    }
    return from;
  }
  function render(){
    var mastered=countKnown(),done=mastered>=cards.length;
    if(done){
      cardButton.classList.add('complete');cardButton.setAttribute('aria-expanded','true');
      side.textContent='Deck complete';prompt.textContent='You know every card.';
      helper.textContent='Use Review all to start another pass.';
      counter.textContent=cards.length+' of '+cards.length+' mastered';
      fill.style.width='100%';progress.setAttribute('aria-valuenow',String(cards.length));
      cardButton.disabled=true;previousButton.disabled=true;nextButton.disabled=true;
      againButton.disabled=true;knowButton.disabled=true;
      statusEl.textContent='Nice work. Your progress is saved on this device.';
    }else{
      var original=currentOriginalIndex(),item=cards[original];
      cardButton.classList.remove('complete');cardButton.disabled=false;
      cardButton.setAttribute('aria-expanded',revealed?'true':'false');
      side.textContent=revealed?'Answer':'Question';prompt.textContent=revealed?item.back:item.front;
      helper.textContent=revealed?'Select to hide the answer':'Select to reveal the answer';
      counter.textContent='Card '+(state.index+1)+' of '+cards.length;
      fill.style.width=(mastered/cards.length*100).toFixed(1)+'%';progress.setAttribute('aria-valuenow',String(mastered));
      previousButton.disabled=state.index===0;nextButton.disabled=state.index>=cards.length-1;
      againButton.disabled=!revealed;knowButton.disabled=!revealed;
      statusEl.textContent=revealed?'Choose Review again or I know this.':'Tap a card to reveal the answer.';
    }
    stats.textContent=mastered+' mastered · '+state.again+' review attempts';
  }
  function moveTo(position){state.index=(position+cards.length)%cards.length;revealed=false;save();render();}
  cardButton.addEventListener('click',function(){if(cardButton.disabled)return;revealed=!revealed;render();});
  previousButton.addEventListener('click',function(){moveTo(Math.max(0,state.index-1));});
  nextButton.addEventListener('click',function(){moveTo(Math.min(cards.length-1,state.index+1));});
  againButton.addEventListener('click',function(){
    var original=currentOriginalIndex(),at=state.known.indexOf(original);
    if(at>=0)state.known.splice(at,1);
    state.again++;state.index=nextUnlearned(state.index);revealed=false;save();render();
  });
  knowButton.addEventListener('click',function(){
    var original=currentOriginalIndex();
    if(state.known.indexOf(original)<0)state.known.push(original);
    state.index=nextUnlearned(state.index);revealed=false;save();render();
  });
  document.getElementById('restart').addEventListener('click',function(){state.known=[];state.index=0;revealed=false;save();render();});
  save();render();
})();
</script>
</body>
</html>
