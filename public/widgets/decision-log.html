<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Decision Log</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#6b6a68;--surface:#f7f7f5;--border:#e9e9e7;--accent:#6940a5;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}.wrap{height:100%;min-height:265px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:14px;font-weight:650;margin-top:2px}.count{font-size:9px;color:var(--muted);text-align:right}.count b{display:block;color:var(--accent-text);font-size:12px}.form{display:grid;grid-template-columns:minmax(0,1fr) 115px;gap:5px}.form input,.form textarea{width:100%;min-width:0;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:5px 7px;font:inherit;font-size:9.5px}.form input{height:30px}.form textarea{min-height:50px;resize:vertical;line-height:1.4}.form input:focus-visible,.form textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form .decision{grid-column:1/2}.form .rationale{grid-column:1/3}.form button{height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 8px;cursor:pointer}.list{display:flex;min-height:58px;flex:1;flex-direction:column;gap:4px;overflow:auto}.row{display:grid;grid-template-columns:minmax(0,1fr) auto 23px;gap:3px 7px;padding:6px 7px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.decision-text{min-width:0;overflow-wrap:anywhere;font-size:10px;font-weight:600}.date{color:var(--accent-text);font-size:8.5px;white-space:nowrap}.rationale-text{grid-column:1/3;overflow-wrap:anywhere;color:var(--muted);font-size:9px;line-height:1.35}.remove{grid-column:3;grid-row:1/3;width:22px;height:22px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.empty{text-align:center;padding:12px;color:var(--muted);font-size:10px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.status,.note{font-size:9px;color:var(--muted);line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}@media(max-width:350px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 100px}.form .decision{grid-column:1/3}.form .rationale{grid-column:1/3}.form button{grid-column:2}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Personal decision notes</div><div class="title" id="title">Decision log</div></div><div class="count"><b id="count">0</b>decisions</div></header>
  <form class="form" id="form"><label class="sr-only" for="decision">Decision</label><input class="decision" id="decision" maxlength="100" placeholder="Decision" required /><label class="sr-only" for="date">Date</label><input id="date" type="date" required /><label class="sr-only" for="rationale">Reason or context</label><textarea class="rationale" id="rationale" maxlength="300" placeholder="Reason or context (optional)"></textarea><button type="submit">Log decision</button></form>
  <section class="list" id="list" aria-label="Decision entries"></section>
  <footer class="foot"><span class="status" id="status" aria-live="polite">Notes stay in this browser. No approval or audit trail.</span><button class="clear" id="clear" type="button">Clear log</button></footer>
  <div class="note">A personal reference, not an approval workflow or shared decision record.</div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(h){var s=String(h).slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function ratio(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function ink(h){var a=rgb(h);return ratio(a,[255,255,255])>=ratio(a,[0,0,0])?'#fff':'#000';}function textColor(h){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(h),to=dark?[255,255,255]:[0,0,0];if(ratio(a,bg)>=4.5)return h;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(ratio(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}function setText(){document.documentElement.style.setProperty('--accent-text',textColor(ACCENT));}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>=0?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#6940a5'),LABEL=String(c.label||'Decision log').slice(0,48),KEY='blocksmith.decision-log.v1',items=[];
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',ink(ACCENT));setText();if(theme==='auto'&&window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',setText);else if(mq.addListener)mq.addListener(setText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;
  function dateKey(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}var date=document.getElementById('date');date.value=dateKey();try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))items=a.filter(function(x){return x&&typeof x.decision==='string';}).slice(0,80);}catch(e){}
  var list=document.getElementById('list'),status=document.getElementById('status');function save(msg){try{localStorage.setItem(KEY,JSON.stringify(items));status.textContent=msg||'Notes stay in this browser. No approval or audit trail.';}catch(e){status.textContent='Storage is unavailable in this browser session.';}}function showDate(v){var d=new Date(v+'T00:00:00');return isNaN(d.getTime())?v:new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(d);}
  function render(){list.textContent='';document.getElementById('count').textContent=String(items.length);if(!items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Log a decision to start a personal reference.';list.appendChild(empty);return;}items.slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));}).forEach(function(item){var index=items.indexOf(item),row=document.createElement('div');row.className='row';var title=document.createElement('span');title.className='decision-text';title.textContent=item.decision;var day=document.createElement('span');day.className='date';day.textContent=showDate(item.date||'');var rationale=document.createElement('span');rationale.className='rationale-text';rationale.textContent=item.rationale||'No context added';var remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove decision: '+item.decision);remove.addEventListener('click',function(){items.splice(index,1);save();render();});row.append(title,day,rationale,remove);list.appendChild(row);});}
  document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var decision=document.getElementById('decision').value.trim().slice(0,100),rationale=document.getElementById('rationale').value.trim().slice(0,300),day=date.value;if(!decision||!/^\d{4}-\d{2}-\d{2}$/.test(day))return;if(items.length>=80){status.textContent='Decision log limit reached.';return;}items.push({decision:decision,rationale:rationale,date:day});document.getElementById('decision').value='';document.getElementById('rationale').value='';date.value=dateKey();save();render();document.getElementById('decision').focus();});document.getElementById('clear').addEventListener('click',function(){items=[];save('Decision log cleared.');render();});render();
})();
</script>
</body>
</html>
