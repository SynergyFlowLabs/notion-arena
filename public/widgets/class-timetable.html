<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Class Timetable</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#2383e2;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}.wrap{height:100%;min-height:270px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:14px;font-weight:650;margin-top:2px}.count{font-size:9px;color:var(--muted);text-align:right}.count b{display:block;color:var(--accent-text);font-size:12px}.form{display:grid;grid-template-columns:minmax(0,1fr) 94px 78px 78px 96px auto;gap:5px}.form input,.form select{min-width:0;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 6px;font:inherit;font-size:9px}.form input:focus-visible,.form select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form button{height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}.form button:focus-visible,.remove:focus-visible,.clear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.list{display:flex;min-height:72px;flex:1;flex-direction:column;gap:5px;overflow:auto}.day-group{display:flex;flex-direction:column;gap:3px}.day-title{padding:2px 3px;color:var(--muted);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}.row{display:grid;grid-template-columns:76px minmax(0,1fr) auto 23px;align-items:center;gap:6px;padding:6px 7px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.time{font-size:9px;color:var(--accent-text);font-variant-numeric:tabular-nums;white-space:nowrap}.course{min-width:0;overflow-wrap:anywhere;font-size:10px;font-weight:600}.room{font-size:8.5px;color:var(--muted);white-space:nowrap}.remove{width:22px;height:22px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.status,.note{font-size:9px;color:var(--muted);line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}.empty{text-align:center;padding:12px;color:var(--muted);font-size:10px}@media(max-width:480px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 1fr 1fr}.form input:first-of-type{grid-column:1/3}.form select{grid-column:3}.form input:last-of-type{grid-column:1/3}.form button{grid-column:3}.row{grid-template-columns:70px minmax(0,1fr) auto 22px;gap:4px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Weekly course overview</div><div class="title" id="title">Class timetable</div></div><div class="count"><b id="count">0</b>classes</div></header>
  <form class="form" id="form"><label class="sr-only" for="course">Class</label><input id="course" maxlength="48" placeholder="Class or course" required /><label class="sr-only" for="day">Weekday</label><select id="day"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select><label class="sr-only" for="start">Start time</label><input id="start" type="time" required /><label class="sr-only" for="end">End time</label><input id="end" type="time" required /><label class="sr-only" for="room">Room or location</label><input id="room" maxlength="36" placeholder="Room (optional)" /><button type="submit">Add</button></form>
  <section class="list" id="list" aria-label="Weekly class timetable"></section>
  <footer class="foot"><span class="status" id="status" aria-live="polite">Timetable stays in this browser. No calendar sync.</span><button class="clear" id="clear" type="button">Clear timetable</button></footer>
  <div class="note">A personal weekly reference, not an official school schedule or calendar sync.</div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(hex){var s=String(hex).slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function contrast(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function accentInk(hex){var a=rgb(hex);return contrast(a,[255,255,255])>=contrast(a,[0,0,0])?'#fff':'#000';}function accentText(hex){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(hex),to=dark?[255,255,255]:[0,0,0];if(contrast(a,bg)>=4.5)return hex;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(contrast(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}function setAccentText(){document.documentElement.style.setProperty('--accent-text',accentText(ACCENT));}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>-1?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#2383e2'),LABEL=String(c.label||'Class timetable').slice(0,48),KEY='blocksmith.class-timetable.v1',days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],items=[];
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',accentInk(ACCENT));setAccentText();if(theme==='auto'&&window.matchMedia){var scheme=window.matchMedia('(prefers-color-scheme: dark)');if(scheme.addEventListener)scheme.addEventListener('change',setAccentText);else if(scheme.addListener)scheme.addListener(setAccentText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;
  try{var parsed=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(parsed))items=parsed.filter(function(x){return x&&typeof x.course==='string'&&days.indexOf(x.day)>=0;}).slice(0,80);}catch(e){}
  var list=document.getElementById('list'),status=document.getElementById('status');function save(message){try{localStorage.setItem(KEY,JSON.stringify(items));status.textContent=message||'Timetable stays in this browser. No calendar sync.';}catch(e){status.textContent='Storage is unavailable in this browser session.';}}
  function render(){list.textContent='';document.getElementById('count').textContent=String(items.length);if(!items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Add a class to sketch your weekly schedule.';list.appendChild(empty);return;}days.forEach(function(day){var rows=items.filter(function(x){return x.day===day;}).sort(function(a,b){return a.start.localeCompare(b.start);});if(!rows.length)return;var group=document.createElement('div');group.className='day-group';var heading=document.createElement('div');heading.className='day-title';heading.textContent=day;group.appendChild(heading);rows.forEach(function(item){var index=items.indexOf(item),row=document.createElement('div');row.className='row';var time=document.createElement('span');time.className='time';time.textContent=item.start+' - '+item.end;var course=document.createElement('span');course.className='course';course.textContent=item.course;var room=document.createElement('span');room.className='room';room.textContent=item.room||'';var remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove '+item.course+' on '+day);remove.addEventListener('click',function(){items.splice(index,1);save();render();});row.append(time,course,room,remove);group.appendChild(row);});list.appendChild(group);});}
  document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var course=document.getElementById('course').value.trim().slice(0,48),day=document.getElementById('day').value,start=document.getElementById('start').value,end=document.getElementById('end').value,room=document.getElementById('room').value.trim().slice(0,36);if(!course||!start||!end||start>=end){status.textContent='Enter a class and an end time later than its start.';return;}if(items.length>=80){status.textContent='Class limit reached.';return;}items.push({course:course,day:day,start:start,end:end,room:room});document.getElementById('course').value='';document.getElementById('start').value='';document.getElementById('end').value='';document.getElementById('room').value='';save();render();document.getElementById('course').focus();});document.getElementById('clear').addEventListener('click',function(){items=[];save('Timetable cleared.');render();});render();
})();
</script>
</body>
</html>
