<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Date Calculator</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#2383e2;--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{height:100%;min-height:205px;display:flex;flex-direction:column;gap:11px;padding:14px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:14px;font-weight:650;margin-top:2px}
.inputs{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field label{font-size:10px;color:var(--muted);font-weight:600}.field input{width:100%;min-width:0;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);padding:5px 7px;font:inherit;font-size:11px}.field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.arrow{padding-bottom:9px;color:var(--muted);font-size:16px}
.result{display:flex;flex:1;min-height:60px;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--border);border-radius:10px;background:var(--surface);text-align:center;padding:8px}.number{font-size:30px;font-weight:650;letter-spacing:-.05em;font-variant-numeric:tabular-nums;color:var(--accent)}.unit{font-size:11px;font-weight:600}.detail{font-size:10px;color:var(--muted)}.foot{font-size:9.5px;color:var(--muted);text-align:center}
@media(max-width:350px){.wrap{padding:10px}.inputs{gap:5px}.field input{font-size:10px}.number{font-size:26px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Date math</div><div class="title" id="title">Date calculator</div></div></header>
  <section class="inputs" aria-label="Choose two dates"><div class="field"><label for="from">From</label><input id="from" type="date" /></div><div class="arrow" aria-hidden="true">→</div><div class="field"><label for="to">To</label><input id="to" type="date" /></div></section>
  <section class="result" aria-live="polite"><div class="number" id="days">30</div><div class="unit" id="unit">days apart</div><div class="detail" id="weekdays">22 weekdays in range</div></section>
  <div class="foot" id="note">Weekdays exclude weekends, not local holidays.</div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function bool(k,d){var v=c[k];return v===undefined?d:(v===true||v==='true'||v==='1');}
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}
  function valid(value){return /^\d{4}-\d{2}-\d{2}$/.test(value)&&!isNaN(new Date(value+'T00:00:00Z').getTime());}
  function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>-1?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#2383e2'),LABEL=String(c.label||'Date calculator').slice(0,48),INCLUSIVE=bool('inclusive',false);
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.getElementById('title').textContent=LABEL;document.title=LABEL;
  var from=document.getElementById('from'),to=document.getElementById('to');
  var today=new Date(),later=new Date(today.getFullYear(),today.getMonth(),today.getDate()+30);
  from.value=valid(String(c.from||''))?String(c.from):iso(today);to.value=valid(String(c.to||''))?String(c.to):iso(later);
  function stamp(value){if(!valid(value))return NaN;var p=value.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]);}
  function paint(){
    var a=stamp(from.value),b=stamp(to.value),daysOut=document.getElementById('days'),unit=document.getElementById('unit'),weekdays=document.getElementById('weekdays');
    if(!isFinite(a)||!isFinite(b)){daysOut.textContent='...';unit.textContent='choose two dates';weekdays.textContent='';return;}
    var lo=Math.min(a,b),hi=Math.max(a,b),apart=Math.round((hi-lo)/864e5),count=apart+(INCLUSIVE?1:0),weekdayCount=0;
    for(var cursor=lo+(INCLUSIVE?0:864e5);cursor<(INCLUSIVE?hi+864e5:hi);cursor+=864e5){var day=new Date(cursor).getUTCDay();if(day!==0&&day!==6)weekdayCount++;}
    daysOut.textContent=String(count);unit.textContent=INCLUSIVE?'calendar days, inclusive':'days apart';weekdays.textContent=weekdayCount+' weekdays in range';
  }
  from.addEventListener('input',paint);to.addEventListener('input',paint);paint();
})();
</script>
</body>
</html>
