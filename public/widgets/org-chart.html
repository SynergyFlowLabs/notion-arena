<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Org Chart</title>
<style>
:root{--bg:#ffffff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#2383e2;--card:#ffffff;--line:#d9d9d7;
--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#202020;--border:#2f2f2f;--card:#252525;--line:#3a3a3a}
@media (prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#202020;--border:#2f2f2f;--card:#252525;--line:#3a3a3a}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;gap:6px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.title{font-size:12.5px;font-weight:600;margin-right:auto}
button{font:inherit;font-size:11px;font-weight:500;border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:7px;padding:3px 9px;cursor:pointer}
button:hover{color:var(--fg);border-color:color-mix(in oklab,var(--fg) 20%,var(--border))}
.stage{flex:1;min-height:0;overflow:auto;position:relative;background:
  radial-gradient(circle at 1px 1px, color-mix(in oklab,var(--fg) 7%,transparent) 1px, transparent 0);
  background-size:20px 20px}
.canvas{transform-origin:0 0;padding:22px;display:inline-block;min-width:100%}
.level{display:flex;justify-content:center;gap:14px;position:relative}
.subtree{display:flex;flex-direction:column;align-items:center}
.node{position:relative;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 10px 7px 8px;
display:flex;align-items:center;gap:8px;min-width:132px;max-width:190px;box-shadow:0 1px 2px rgba(15,15,15,.05);cursor:default}
.node.vacant{border-style:dashed;background:transparent;box-shadow:none;opacity:.75}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;
color:#fff;flex:0 0 auto;letter-spacing:.02em;background:var(--accent)}
.who{min-width:0}
.who b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.who span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw{position:absolute;right:-7px;top:-7px;width:16px;height:16px;border-radius:50%;border:1px solid var(--border);background:var(--bg);
color:var(--muted);font-size:10px;line-height:14px;text-align:center;cursor:pointer;font-weight:700;user-select:none}
.tw:hover{border-color:var(--accent);color:var(--accent)}
.kids{display:flex;gap:14px;margin-top:20px;position:relative}
.kids::before{content:"";position:absolute;top:-20px;left:50%;width:1px;height:20px;background:var(--line)}
.kid{position:relative;padding-top:20px}
.kid::before{content:"";position:absolute;top:0;left:50%;width:1px;height:20px;background:var(--line)}
.kids>.kid:first-child::after,.kids>.kid:last-child::after{content:"";position:absolute;top:0;height:1px;background:var(--line)}
.kids>.kid:first-child::after{left:50%;right:-7px}
.kids>.kid:last-child::after{left:-7px;right:50%}
.kids>.kid:only-child::after{display:none}
.count{font-size:10px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:0 6px;font-weight:600}
.zoom{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="title" id="title">Team</div>
    <span class="count" id="count"></span>
    <button id="out">−</button><span class="zoom" id="zoom">100%</span><button id="in">+</button>
    <button id="expand">Expand all</button>
    <button id="collapse">Collapse</button>
    <button id="svg">Copy SVG</button>
  </div>
  <div class="stage" id="stage"><div class="canvas" id="canvas"></div></div>
</div>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};
  try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];
  q.forEach(function(v,k){c[k]=v;});

  var ACCENT=c.accent||'#2383e2';
  if(c.theme)document.documentElement.setAttribute('data-theme',c.theme);
  document.documentElement.style.setProperty('--accent',ACCENT);
  if(c.title)document.getElementById('title').textContent=c.title;

  var PALETTE=['#2383e2','#0f7b6c','#6940a5','#d9730d','#ad1a72','#0b6e99','#9f6b53','#dfab01'];
  var DEMO=[
    {name:'Amara Osei',role:'Chief Executive'},
    {name:'Dev Raman',role:'VP Engineering',reportsTo:'Amara Osei'},
    {name:'Lena Fischer',role:'VP Design',reportsTo:'Amara Osei'},
    {name:'Tomás Silva',role:'Head of Revenue',reportsTo:'Amara Osei'},
    {name:'Yuki Tanaka',role:'Platform Lead',reportsTo:'Dev Raman'},
    {name:'Grace Adeyemi',role:'Product Eng Lead',reportsTo:'Dev Raman'},
    {name:'Open role',role:'Staff Engineer',reportsTo:'Grace Adeyemi',vacant:true},
    {name:'Marco Bianchi',role:'Design Systems',reportsTo:'Lena Fischer'},
    {name:'Sara Haddad',role:'Product Design',reportsTo:'Lena Fischer'},
    {name:'Jonas Weber',role:'Account Executive',reportsTo:'Tomás Silva'},
    {name:'Priya Nair',role:'Solutions Engineer',reportsTo:'Tomás Silva'}
  ];
  var people=DEMO;
  if(c.data){
    try{
      var parsed=JSON.parse(decodeURIComponent(String(c.data)));
      if(Array.isArray(parsed)&&parsed.length)people=parsed;
    }catch(e){}
  }

  var byName={},order=[];
  people.forEach(function(p,i){
    var node={id:i,name:String(p.name||'Untitled'),role:String(p.role||''),reportsTo:p.reportsTo||p.manager||null,
      vacant:!!p.vacant,color:p.color||PALETTE[i%PALETTE.length],
      initials:(p.initials||String(p.name||'?').split(/\s+/).map(function(s){return s[0];}).slice(0,2).join('')).toUpperCase(),
      kids:[],collapsed:false};
    byName[node.name.toLowerCase()]=node;order.push(node);
  });
  var roots=[];
  order.forEach(function(n){
    var key=String(n.reportsTo||'').toLowerCase();
    if(key&&byName[key]){byName[key].kids.push(n);}else{roots.push(n);}
  });
  document.getElementById('count').textContent=order.length+' people';

  var canvas=document.getElementById('canvas'),stage=document.getElementById('stage');
  var scale=1;
  function applyZoom(){canvas.style.transform='scale('+scale+')';document.getElementById('zoom').textContent=Math.round(scale*100)+'%';}

  function subtreeCount(n){return n.kids.reduce(function(a,k){return a+1+subtreeCount(k);},0);}
  function nodeHtml(n){
    var kids=subtreeCount(n);
    var tw=n.kids.length?'<span class="tw" data-toggle="'+n.id+'">'+(n.collapsed?'+':'−')+'</span>':'';
    return '<div class="node'+(n.vacant?' vacant':'')+'" data-id="'+n.id+'" title="'+n.name.replace(/"/g,'')+', '+n.role.replace(/"/g,'')+(kids?' · '+kids+' report'+(kids===1?'s':''):'')+'">'+
      '<span class="av" style="background:'+(n.vacant?'transparent':n.color)+';'+(n.vacant?'border:1.5px dashed var(--line);color:var(--muted)':'')+'">'+(n.vacant?'+':n.initials)+'</span>'+
      '<span class="who"><b>'+n.name.replace(/[<>&]/g,'')+'</b><span>'+n.role.replace(/[<>&]/g,'')+'</span></span>'+tw+'</div>';
  }
  function render(n){
    if(n.collapsed||!n.kids.length)return '<div class="subtree">'+nodeHtml(n)+'</div>';
    var kids=n.kids.map(function(k){return '<div class="kid">'+render(k)+'</div>';}).join('');
    return '<div class="subtree">'+nodeHtml(n)+'<div class="kids">'+kids+'</div></div>';
  }
  function draw(){
    canvas.innerHTML=roots.map(render).join('');
    canvas.querySelectorAll('[data-toggle]').forEach(function(el){
      el.addEventListener('click',function(e){
        e.stopPropagation();
        var n=order[parseInt(el.dataset.toggle,10)];
        n.collapsed=!n.collapsed;draw();
      });
    });
  }
  document.getElementById('in').addEventListener('click',function(){scale=Math.min(2,scale+0.1);applyZoom();});
  document.getElementById('out').addEventListener('click',function(){scale=Math.max(0.4,scale-0.1);applyZoom();});
  document.getElementById('expand').addEventListener('click',function(){order.forEach(function(n){n.collapsed=false;});draw();});
  document.getElementById('collapse').addEventListener('click',function(){order.forEach(function(n){if(n.kids.length&&n!==roots[0])n.collapsed=true;});draw();});
  stage.addEventListener('wheel',function(e){
    if(!(e.ctrlKey||e.metaKey))return;
    e.preventDefault();
    scale=Math.max(0.4,Math.min(2,scale+(e.deltaY<0?0.08:-0.08)));applyZoom();
  },{passive:false});

  document.getElementById('svg').addEventListener('click',function(e){
    var b=e.currentTarget;
    var w=canvas.scrollWidth,h=canvas.scrollHeight;
    var css=Array.prototype.slice.call(document.querySelectorAll('style')).map(function(s){return s.textContent;}).join('\n');
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
      '<foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>'+css+'</style>'+
      canvas.innerHTML+'</div></foreignObject></svg>';
    function done(t){b.textContent=t;setTimeout(function(){b.textContent='Copy SVG';},1400);}
    try{navigator.clipboard.writeText(svg).then(function(){done('Copied ✓');},function(){done('See console');});}catch(err){done('See console');}
    try{console.log(svg);}catch(err){}
  });

  draw();applyZoom();
})();
</script>
</body>
</html>
