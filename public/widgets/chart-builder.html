<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Offline Chart Builder</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#6b6a68;--surface:#f7f7f5;--border:#e9e9e7;--accent:#2383e2;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}.wrap{height:100%;min-height:260px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:14px;font-weight:650;margin-top:2px}.count{font-size:9px;color:var(--muted);text-align:right}.count b{display:block;color:var(--accent-text);font-size:12px}.form{display:grid;grid-template-columns:minmax(0,1fr) 108px auto;gap:5px}.form input{min-width:0;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 7px;font:inherit;font-size:9.5px}.form input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form button{height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:9px;padding:4px 8px;cursor:pointer}.chart{display:flex;min-height:70px;flex:1;flex-direction:column;gap:8px;overflow:auto;padding:3px 1px}.bar-row{display:grid;grid-template-columns:minmax(52px,96px) minmax(40px,1fr) auto 22px;align-items:center;gap:7px}.label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9.5px}.track{height:14px;overflow:hidden;border:1px solid var(--border);border-radius:5px;background:var(--surface)}.bar{height:100%;border-radius:4px;background:var(--accent)}.value{min-width:36px;color:var(--accent-text);font-size:9px;text-align:right;font-variant-numeric:tabular-nums}.remove{width:21px;height:21px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);cursor:pointer}.remove:hover{border-color:var(--danger);color:var(--danger)}.empty{text-align:center;padding:12px;color:var(--muted);font-size:10px}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.status,.note{font-size:9px;color:var(--muted);line-height:1.35}.clear{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}@media(max-width:340px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 88px auto}.bar-row{grid-template-columns:minmax(42px,74px) minmax(35px,1fr) auto 21px;gap:4px}.value{min-width:32px;font-size:8px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Chart from your values</div><div class="title" id="title">Chart builder</div></div><div class="count"><b id="count">0</b>values</div></header>
  <form class="form" id="form"><label class="sr-only" for="label">Category label</label><input id="label" maxlength="32" placeholder="Category" required /><label class="sr-only" for="value">Numeric value</label><input id="value" type="number" min="0" max="1000000000000" step="any" placeholder="Value" required /><button type="submit">Add</button></form>
  <section class="chart" id="chart" role="list" aria-label="Horizontal bar chart"></section>
  <footer class="foot"><span class="status" id="status" aria-live="polite">Bars scale to your largest value. Data stays local.</span><button class="clear" id="clear" type="button">Clear chart</button></footer>
  <div class="note">Uses only values you enter; no live data, external requests, or automatic analysis.</div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}function rgb(h){var s=String(h).slice(1);return[0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}function lum(a){return a.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}function ratio(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);}function ink(h){var a=rgb(h);return ratio(a,[255,255,255])>=ratio(a,[0,0,0])?'#fff':'#000';}function textColor(h){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),a=rgb(h),to=dark?[255,255,255]:[0,0,0];if(ratio(a,bg)>=4.5)return h;for(var t=.02;t<=1;t+=.02){var m=a.map(function(v,i){return Math.round(v+(to[i]-v)*t);});if(ratio(m,bg)>=4.5)return'#'+m.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}function setText(){document.documentElement.style.setProperty('--accent-text',textColor(ACCENT));}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>=0?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#2383e2'),LABEL=String(c.label||'Chart builder').slice(0,48),KEY='blocksmith.chart-builder.v1',items=[];
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',ink(ACCENT));setText();if(theme==='auto'&&window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');if(mq.addEventListener)mq.addEventListener('change',setText);else if(mq.addListener)mq.addListener(setText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;
  try{var a=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(a))items=a.filter(function(x){return x&&typeof x.label==='string'&&isFinite(Number(x.value))&&Number(x.value)>=0;}).slice(0,40);}catch(e){}var chart=document.getElementById('chart'),status=document.getElementById('status');function save(msg){try{localStorage.setItem(KEY,JSON.stringify(items));status.textContent=msg||'Bars scale to your largest value. Data stays local.';}catch(e){status.textContent='Storage is unavailable in this browser session.';}}function format(v){return new Intl.NumberFormat(undefined,{maximumFractionDigits:3}).format(v);}
  function render(){chart.textContent='';document.getElementById('count').textContent=String(items.length);if(!items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Add categories and values to build a small bar chart.';chart.appendChild(empty);return;}var max=items.reduce(function(m,x){return Math.max(m,Number(x.value)||0);},0);items.forEach(function(item,index){var row=document.createElement('div');row.className='bar-row';row.setAttribute('role','listitem');var label=document.createElement('span');label.className='label';label.textContent=item.label;var track=document.createElement('div');track.className='track';track.setAttribute('aria-hidden','true');var bar=document.createElement('div');bar.className='bar';bar.style.width=(max>0?Number(item.value)/max*100:0)+'%';track.appendChild(bar);var value=document.createElement('span');value.className='value';value.textContent=format(Number(item.value));var remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove '+item.label);remove.addEventListener('click',function(){items.splice(index,1);save();render();});row.setAttribute('aria-label',item.label+', '+format(Number(item.value)));row.append(label,track,value,remove);chart.appendChild(row);});}
  document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var label=document.getElementById('label').value.trim().slice(0,32),value=Number(document.getElementById('value').value);if(!label||!isFinite(value)||value<0||value>1000000000000){status.textContent='Enter a category and a non-negative value up to one trillion.';return;}if(items.length>=40){status.textContent='Chart limit reached.';return;}items.push({label:label,value:value});document.getElementById('label').value='';document.getElementById('value').value='';save();render();document.getElementById('label').focus();});document.getElementById('clear').addEventListener('click',function(){items=[];save('Chart cleared.');render();});render();
})();
</script>
</body>
</html>
