<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>World Clocks</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#2383e2;--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{height:100%;min-height:170px;display:flex;flex-direction:column;gap:10px;padding:14px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:14px;font-weight:650;margin-top:2px}.local{font-size:10px;color:var(--muted)}
.clocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;flex:1}.clock{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:9px;border:1px solid var(--border);border-radius:9px;background:var(--surface)}.city{font-size:10px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{font-size:clamp(18px,5vw,28px);font-weight:650;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}.date{font-size:9px;color:var(--muted);white-space:nowrap}.zone{font-size:8.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:9.5px;color:var(--muted)}
@media(max-width:420px){.clocks{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:11px}.clock{padding:8px}.time{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Time zones</div><div class="title" id="title">World clocks</div></div><div class="local" id="local"></div></header>
  <section class="clocks" id="clocks" aria-label="Configured world clocks"></section>
  <div class="note" id="note"></div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}
  function bool(k,d){var v=c[k];return v===undefined?d:(v===true||v==='true'||v==='1');}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>-1?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#2383e2');
  var LABEL=String(c.label||'World clocks').slice(0,48),H24=bool('h24',false);
  var DEFAULT=[{zone:'Asia/Karachi',label:'Islamabad'},{zone:'Europe/London',label:'London'},{zone:'America/New_York',label:'New York'}],zones=[];
  String(c.zones||'').split('||').slice(0,6).forEach(function(entry){var cut=entry.indexOf('::'),zone=(cut<0?entry:entry.slice(0,cut)).trim(),label=(cut<0?'':entry.slice(cut+2)).trim();if(!zone)return;try{new Intl.DateTimeFormat(undefined,{timeZone:zone});zones.push({zone:zone,label:(label||zone.split('/').pop().replace(/_/g,' ')).slice(0,32)});}catch(e){}});
  if(!zones.length)zones=DEFAULT;
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);
  document.getElementById('title').textContent=LABEL;document.title=LABEL;
  document.getElementById('local').textContent='Your time: '+new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'}).format(new Date());
  var host=document.getElementById('clocks'),nodes=[];
  zones.forEach(function(item){var card=document.createElement('article'),city=document.createElement('div'),time=document.createElement('div'),date=document.createElement('div'),zone=document.createElement('div');card.className='clock';city.className='city';time.className='time';date.className='date';zone.className='zone';city.textContent=item.label;zone.textContent=item.zone;card.appendChild(city);card.appendChild(time);card.appendChild(date);card.appendChild(zone);host.appendChild(card);nodes.push({item:item,time:time,date:date});});
  function paint(){var now=new Date();nodes.forEach(function(n){var opts=H24?{timeZone:n.item.zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}:{timeZone:n.item.zone,hour:'numeric',minute:'2-digit',hour12:true};n.time.textContent=new Intl.DateTimeFormat(undefined,opts).format(now);n.date.textContent=new Intl.DateTimeFormat(undefined,{timeZone:n.item.zone,weekday:'short',month:'short',day:'numeric'}).format(now);});document.getElementById('local').textContent='Your time: '+new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'}).format(now);}
  document.getElementById('note').textContent=zones.length+' configured zones, using this device clock.';
  paint();setInterval(paint,15000);
})();
</script>
</body>
</html>
