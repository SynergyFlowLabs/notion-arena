<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Household Chore Checklist</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#0f7b6c;--accent-ink:#fff;--accent-text:var(--accent);--danger:#c24136}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--danger:#ff7369}}
*{box-sizing:border-box}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}.wrap{height:100%;min-height:250px;display:flex;flex-direction:column;gap:8px;padding:13px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:14px;font-weight:650;margin-top:2px}.summary{font-size:10px;color:var(--muted);text-align:right}.summary b{display:block;color:var(--accent-text);font-size:13px;font-variant-numeric:tabular-nums}.form{display:grid;grid-template-columns:minmax(0,1fr) 88px 94px auto;gap:5px}.form input,.form select{min-width:0;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 6px;font:inherit;font-size:9.5px}.form input:focus-visible,.form select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.form button{height:30px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:10px;padding:4px 8px;cursor:pointer}.form button:focus-visible,.foot button:focus-visible,.remove:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.list{display:flex;min-height:60px;flex:1;flex-direction:column;gap:4px;overflow:auto}.row{display:grid;grid-template-columns:17px minmax(0,1fr) auto 24px;align-items:center;gap:6px;min-height:34px;padding:4px 6px;border:1px solid var(--border);border-radius:7px;background:var(--surface)}.row input{width:14px;height:14px;margin:0;accent-color:var(--accent)}.task{min-width:0;overflow-wrap:anywhere;font-size:10px;font-weight:550}.row.done .task{color:var(--muted);text-decoration:line-through}.meta{font-size:8.5px;color:var(--muted);white-space:nowrap}.remove{width:23px;height:23px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}.remove:hover{color:var(--danger);border-color:var(--danger)}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}.status{font-size:9px;color:var(--muted)}.foot button{min-height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:9px;padding:4px 7px;cursor:pointer}.foot button:hover{border-color:var(--accent)}.empty{text-align:center;padding:12px;color:var(--muted);font-size:10px}@media(max-width:350px){.wrap{padding:10px}.form{grid-template-columns:minmax(0,1fr) 78px auto;gap:4px}.form .assignee{grid-column:1/3}.row{grid-template-columns:17px minmax(0,1fr) auto 23px}.meta{font-size:8px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Household planning</div><div class="title" id="title">Chore checklist</div></div><div class="summary"><b id="progress">0 / 0</b>done</div></header>
  <form class="form" id="form"><label class="sr-only" for="task">Chore</label><input id="task" maxlength="60" placeholder="Add a chore" required /><label class="sr-only" for="day">Day</label><select id="day"><option value="">Any day</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select><label class="sr-only" for="assignee">Person</label><input class="assignee" id="assignee" maxlength="36" placeholder="Person (optional)" /><button type="submit">Add</button></form>
  <section class="list" id="list" aria-label="Household chores"></section>
  <footer class="foot"><span class="status" id="status" aria-live="polite">Saved only in this browser. No household sync.</span><button id="clear" type="button">Clear completed</button></footer>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}
  function rgb(hex){var s=String(hex).slice(1);return [0,2,4].map(function(i){return parseInt(s.slice(i,i+2),16);});}
  function luminance(values){return values.map(function(v){v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce(function(a,v,i){return a+v*[.2126,.7152,.0722][i];},0);}
  function contrast(a,b){var x=luminance(a),y=luminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
  function accentInk(hex){var c=rgb(hex);return contrast(c,[255,255,255])>=contrast(c,[0,0,0])?'#fff':'#000';}
  function accentText(hex){var dark=theme==='dark'||(theme==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),bg=rgb(dark?'#252525':'#f7f7f5'),start=rgb(hex),target=dark?[255,255,255]:[0,0,0];if(contrast(start,bg)>=4.5)return hex;for(var t=.02;t<=1;t+=.02){var mixed=start.map(function(v,i){return Math.round(v+(target[i]-v)*t);});if(contrast(mixed,bg)>=4.5)return '#'+mixed.map(function(v){return v.toString(16).padStart(2,'0');}).join('');}return dark?'#fff':'#191919';}
  function setAccentText(){document.documentElement.style.setProperty('--accent-text',accentText(ACCENT));}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>-1?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#0f7b6c'),LABEL=String(c.label||'Chore checklist').slice(0,48),KEY='blocksmith.chore-checklist.v1',items=[];
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.documentElement.style.setProperty('--accent-ink',accentInk(ACCENT));setAccentText();if(theme==='auto'&&window.matchMedia){var scheme=window.matchMedia('(prefers-color-scheme: dark)');if(scheme.addEventListener)scheme.addEventListener('change',setAccentText);else if(scheme.addListener)scheme.addListener(setAccentText);}document.getElementById('title').textContent=LABEL;document.title=LABEL;
  try{var parsed=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(parsed))items=parsed.filter(function(x){return x&&typeof x.task==='string';}).slice(0,100);}catch(e){}
  var list=document.getElementById('list'),status=document.getElementById('status');function save(message){try{localStorage.setItem(KEY,JSON.stringify(items));status.textContent=message||'Saved only in this browser. No household sync.';}catch(e){status.textContent='Storage is unavailable in this browser session.';}}
  function render(){list.textContent='';var complete=items.filter(function(x){return x.done;}).length;document.getElementById('progress').textContent=complete+' / '+items.length;if(!items.length){var empty=document.createElement('div');empty.className='empty';empty.textContent='Add a household task to start the list.';list.appendChild(empty);return;}items.forEach(function(item,index){var row=document.createElement('div');row.className='row'+(item.done?' done':'');var check=document.createElement('input');check.type='checkbox';check.checked=!!item.done;check.setAttribute('aria-label',(item.done?'Mark incomplete: ':'Complete: ')+item.task);check.addEventListener('change',function(){item.done=check.checked;save();render();});var task=document.createElement('span');task.className='task';task.textContent=item.task;var meta=document.createElement('span');meta.className='meta';meta.textContent=[item.day,item.assignee].filter(Boolean).join(' · ')||'Unassigned';var remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove '+item.task);remove.addEventListener('click',function(){items.splice(index,1);save();render();});row.append(check,task,meta,remove);list.appendChild(row);});}
  document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var task=document.getElementById('task').value.trim().slice(0,60),day=document.getElementById('day').value,assignee=document.getElementById('assignee').value.trim().slice(0,36);if(!task)return;if(items.length>=100){status.textContent='List limit reached.';return;}items.push({task:task,day:day,assignee:assignee,done:false});document.getElementById('task').value='';document.getElementById('day').value='';document.getElementById('assignee').value='';save();render();document.getElementById('task').focus();});
  document.getElementById('clear').addEventListener('click',function(){items=items.filter(function(x){return !x.done;});save('Completed chores cleared.');render();});render();
})();
</script>
</body>
</html>
