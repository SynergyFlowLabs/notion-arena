<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Moon Phase</title>
<style>
:root{--bg:#fff;--fg:#37352f;--muted:#787774;--surface:#f7f7f5;--border:#e9e9e7;--accent:#6940a5;--track:#e9e9e7;--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
html[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--track:#343434}
@media(prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#191919;--fg:#e6e6e4;--muted:#9b9a97;--surface:#252525;--border:#343434;--track:#343434}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{height:100%;min-height:200px;display:flex;flex-direction:column;gap:9px;padding:14px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:650}.title{font-size:14px;font-weight:650;margin-top:2px}.date{width:128px;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg);padding:4px 6px;font:inherit;font-size:10px}
.main{display:flex;align-items:center;justify-content:center;gap:18px;flex:1;flex-wrap:wrap}.moon{display:grid;place-items:center;width:100px;height:100px;flex:0 0 auto;border-radius:50%;background:color-mix(in oklab,var(--accent) 9%,var(--surface));font-size:58px;line-height:1}.details{display:flex;min-width:155px;flex:1;flex-direction:column;gap:6px}.phase{font-size:14px;font-weight:650}.illum{font-size:11px;color:var(--muted)}.bar{height:5px;border-radius:99px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s ease}.foot{font-size:9px;color:var(--muted);line-height:1.35}
@media(max-width:350px){.wrap{padding:10px}.main{gap:10px}.moon{width:78px;height:78px;font-size:48px}.details{min-width:140px}.date{width:112px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="wrap">
  <header class="head"><div><div class="kicker">Lunar cycle</div><div class="title" id="title">Moon phase</div></div><input class="date" id="date" type="date" aria-label="Choose date" /></header>
  <section class="main"><div class="moon" id="moon" role="img" aria-label="Moon phase icon">🌔</div><div class="details"><div class="phase" id="phase">Waxing gibbous</div><div class="illum" id="illum">Illumination 72%</div><div class="bar" role="progressbar" id="bar" aria-label="Lunar cycle progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div><div class="foot" id="nextFull"></div></div></section>
  <div class="foot">Approximate phase estimate. Local date only, no location or live astronomy service.</div>
</main>
<script>
(function(){
  var cfgEl=document.getElementById('bk-config'),base={};try{base=cfgEl?JSON.parse(cfgEl.textContent||'{}'):{};}catch(e){}
  var q=new URLSearchParams(location.search),c={};for(var k in base)c[k]=base[k];q.forEach(function(v,k){c[k]=v;});
  function safeColor(v,d){return /^#[0-9a-f]{6}$/i.test(String(v||''))?String(v):d;}
  function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  var theme=['auto','light','dark'].indexOf(String(c.theme||'auto'))>-1?String(c.theme||'auto'):'auto',ACCENT=safeColor(c.accent,'#6940a5'),LABEL=String(c.label||'Moon phase').slice(0,48);
  document.documentElement.setAttribute('data-theme',theme);document.documentElement.style.setProperty('--accent',ACCENT);document.getElementById('title').textContent=LABEL;document.title=LABEL;
  var dateInput=document.getElementById('date');dateInput.value=/^\d{4}-\d{2}-\d{2}$/.test(String(c.date||''))?String(c.date):iso(new Date());
  var SYNODIC=29.530588853,EPOCH=Date.UTC(2000,0,6,18,14),NAMES=['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'],ICONS=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
  function paint(){
    var parts=dateInput.value.split('-').map(Number),valid=parts.length===3&&parts[0]>999&&!isNaN(Date.UTC(parts[0],parts[1]-1,parts[2]));
    if(!valid)return;
    var stamp=Date.UTC(parts[0],parts[1]-1,parts[2],12),phase=((stamp-EPOCH)/(SYNODIC*864e5)%1+1)%1,age=phase*SYNODIC,index=Math.round(phase*8)%8,illum=(1-Math.cos(2*Math.PI*phase))/2;
    document.getElementById('moon').textContent=ICONS[index];document.getElementById('moon').setAttribute('aria-label',NAMES[index]);
    document.getElementById('phase').textContent=NAMES[index];document.getElementById('illum').textContent='Illumination '+Math.round(illum*100)+'%';
    var pct=Math.round(phase*100);document.getElementById('fill').style.width=pct+'%';document.getElementById('bar').setAttribute('aria-valuenow',String(pct));
    var toFull=((.5-phase+1)%1)*SYNODIC;document.getElementById('nextFull').textContent='Cycle day '+age.toFixed(1)+' of about '+SYNODIC.toFixed(1)+' · about '+Math.max(0,Math.round(toFull))+' days to full moon.';
  }
  dateInput.addEventListener('input',paint);paint();
})();
</script>
</body>
</html>
