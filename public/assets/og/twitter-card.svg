<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1200" height="600" fill="#0f0f0f"/>
  
  <!-- Subtle pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" stroke="white" stroke-width="0.5" fill="none"/>
    </pattern>
    <rect width="1200" height="600" fill="url(#grid)"/>
  </g>
  
  <!-- Gradient orbs -->
  <circle cx="150" cy="150" r="200" fill="#6940a5" opacity="0.15" filter="url(#blur)"/>
  <circle cx="1050" cy="450" r="250" fill="#0f7b6c" opacity="0.15" filter="url(#blur)"/>
  <circle cx="600" cy="300" r="180" fill="#2383e2" opacity="0.1" filter="url(#blur)"/>
  
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
  </defs>

  <!-- Logo Area -->
  <g transform="translate(100, 150)">
    <svg width="80" height="80" viewBox="0 0 64 64">
      <defs>
        <linearGradient id="logoGrad" x1="0" y1="0" x2="64" y2="64">
          <stop offset="0%" stop-color="#6940a5"/>
          <stop offset="50%" stop-color="#0f7b6c"/>
          <stop offset="100%" stop-color="#2383e2"/>
        </linearGradient>
      </defs>
      <path d="M32 4C16.5 4 4 16.5 4 32s12.5 28 28 28 28-12.5 28-28S47.5 4 32 4z" fill="url(#logoGrad)" opacity="0.15"/>
      <path d="M32 4C16.5 4 4 16.5 4 32s12.5 28 28 28 28-12.5 28-28S47.5 4 32 4z" fill="none" stroke="url(#logoGrad)" stroke-width="2.5"/>
      <polygon points="32,14 46,22 46,38 32,46 18,38 18,22" fill="none" stroke="url(#logoGrad)" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="32" cy="32" r="6" fill="url(#logoGrad)"/>
      <circle cx="32" cy="18" r="3" fill="#0f7b6c"/>
      <circle cx="46" cy="32" r="3" fill="#2383e2"/>
      <circle cx="32" cy="46" r="3" fill="#d9730d"/>
      <circle cx="18" cy="32" r="3" fill="#ad1a72"/>
      <path d="M32 18V26M32 38V46M26 32H38M18 32H26" stroke="url(#logoGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </svg>
  </g>

  <!-- Title -->
  <text x="220" y="190" font-size="42" font-weight="800" fill="white">Notion Arena</text>
  <text x="220" y="240" font-size="20" fill="#9ca3af">The component registry for Notion</text>

  <!-- Stats Pills -->
  <g transform="translate(220, 280)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="48" rx="24" fill="#1f2937" stroke="#374151"/>
      <text x="90" y="32" font-size="16" font-weight="700" fill="white" text-anchor="middle">168 Widgets</text>
    </g>
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="160" height="48" rx="24" fill="#1f2937" stroke="#374151"/>
      <text x="80" y="32" font-size="16" font-weight="700" fill="white" text-anchor="middle">11 Recipes</text>
    </g>
    <g transform="translate(380, 0)">
      <rect x="0" y="0" width="140" height="48" rx="24" fill="#1f2937" stroke="#374151"/>
      <text x="70" y="32" font-size="16" font-weight="700" fill="white" text-anchor="middle">MCP Ready</text>
    </g>
    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="140" height="48" rx="24" fill="#1f2937" stroke="#374151"/>
      <text x="70" y="32" font-size="16" font-weight="700" fill="white" text-anchor="middle">Free & Pro</text>
    </g>
  </g>

  <!-- Category badges -->
  <g transform="translate(220, 360)" font-size="13">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="100" height="32" rx="16" fill="#d9730d"/>
      <text x="50" y="22" font-weight="600" fill="white" text-anchor="middle">Time</text>
    </g>
    <g transform="translate(115, 0)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#2383e2"/>
      <text x="65" y="22" font-weight="600" fill="white" text-anchor="middle">Dashboards</text>
    </g>
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="100" height="32" rx="16" fill="#0f7b6c"/>
      <text x="50" y="22" font-weight="600" fill="white" text-anchor="middle">Trackers</text>
    </g>
    <g transform="translate(375, 0)">
      <rect x="0" y="0" width="110" height="32" rx="16" fill="#6940a5"/>
      <text x="55" y="22" font-weight="600" fill="white" text-anchor="middle">Planning</text>
    </g>
    <g transform="translate(500, 0)">
      <rect x="0" y="0" width="110" height="32" rx="16" fill="#b56a18"/>
      <text x="55" y="22" font-weight="600" fill="white" text-anchor="middle">Business</text>
    </g>
    <g transform="translate(625, 0)">
      <rect x="0" y="0" width="80" height="32" rx="16" fill="#9065b0"/>
      <text x="40" y="22" font-weight="600" fill="white" text-anchor="middle">Docs</text>
    </g>
    <g transform="translate(720, 0)">
      <rect x="0" y="0" width="90" height="32" rx="16" fill="#ad1a72"/>
      <text x="45" y="22" font-weight="600" fill="white" text-anchor="middle">Visuals</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="600" y="550" font-size="14" fill="#6b7280" text-anchor="middle">notionarena.vercel.app  •  github.com/SynergyFlowLabs/notion-arena</text>
  <text x="600" y="575" font-size="12" fill="#4b5563" text-anchor="middle">Notion is a trademark of Notion Labs Inc. Independent project.</text>
</svg>