    <rect x="0" y="0" width="350" height="280" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="0" y="0" width="350" height="40" rx="12" fill="#f9fafb"/>
    <text x="175" y="26" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">🕰️ Flip Clock</text>
    
    <!-- Clock display -->
    <g transform="translate(175, 150)" text-anchor="middle">
      <g transform="translate(-100, 0)">
        <rect x="0" y="-30" width="60" height="70" rx="6" fill="#1f1f1f"/>
        <text x="30" y="18" font-size="42" font-weight="700" fill="white" font-family="monospace">14</text>
        <rect x="0" y="42" width="60" height="20" rx="3" fill="#374151"/>
        <text x="30" y="56" font-size="10" fill="#9ca3af" font-family="monospace">HOURS</text>
      </g>
      <text x="0" y="20" font-size="42" font-weight="700" fill="#6b7280" font-family="monospace">:</text>
      <g transform="translate(40, 0)">
        <rect x="0" y="-30" width="60" height="70" rx="6" fill="#1f1f1f"/>
        <text x="30" y="18" font-size="42" font-weight="700" fill="white" font-family="monospace">32</text>
        <rect x="0" y="42" width="60" height="20" rx="3" fill="#374151"/>
