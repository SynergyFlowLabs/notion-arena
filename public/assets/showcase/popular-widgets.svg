      <text x="120" y="0" fill="#16a34a">✓ Beta</text>
      <text x="200" y="0" fill="#6940a5">✓ GA</text>
      <text x="270" y="0" fill="#d9730d">○ Scale</text>
      <text x="330" y="0" fill="#d9730d">○ Review</text>
    </g>
