        <rect x="16" y="0" width="12" height="12" rx="2" fill="#0f7b6c"/>
        <rect x="32" y="0" width="12" height="12" rx="2" fill="#0f7b6c"/>
        <rect x="48" y="0" width="12" height="12" rx="2" fill="#e5e7eb"/>
        <rect x="64" y="0" width="12" height="12" rx="2" fill="#0f7b6c"/>
        <rect x="80" y="0" width="12" height="12" rx="2" fill="#0f7b6c"/>
        <rect x="96" y="0" width="12" height="12" rx="2" fill="#0f7b6c"/>
        <rect x="112" y="0" width="12" height="12" rx="2" fill="#e5e7eb"/>
        <rect x="128" y="0" width="12" height="12" rx="2" fill="#0f7b6c"/>
