      <text x="75" y="65" font-size="11" fill="#2563eb" text-anchor="middle">▲ +8.1% vs last month</text>
      <polyline points="0,80 20,75 40,60 60,65 80,55 100,50 120,40 140,35 150,30" stroke="#2563eb" stroke-width="2" fill="none"/>
      <circle cx="150" cy="30" r="3" fill="#2563eb"/>
