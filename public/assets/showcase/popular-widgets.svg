      <text x="75" y="20" font-size="11" font-weight="600" fill="#a16207" text-anchor="middle">Conv. Rate</text>
      <text x="75" y="45" font-size="24" font-weight="700" fill="#1f1f1f" text-anchor="middle">3.2%</text>
      <text x="75" y="65" font-size="11" fill="#ca8a04" text-anchor="middle">▼ -0.4% vs last month</text>
      <polyline points="0,50 20,55 40,45 60,50 80,48 100,52 120,48 140,45 150,42" stroke="#ca8a04" stroke-width="2" fill="none"/>
      <circle cx="150" cy="42" r="3" fill="#ca8a04"/>
    </g>
    <g transform="translate(185, 165)">
