        <text x="37.5" y="55" font-size="9" fill="#1d4ed8" text-anchor="middle">Build pomodoro widget</text>
      </g>
      <g transform="translate(170, 0)">
        <rect x="0" y="0" width="75" height="25" rx="4" fill="#f3f4f6"/>
        <text x="37.5" y="17" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">Doing</text>
        <rect x="0" y="30" width="75" height="50" rx="4" fill="#fce7f3" stroke="#f9a8d4" stroke-width="0.5"/>
        <text x="37.5" y="55" font-size="9" fill="#be185d" text-anchor="middle">Write tests</text>
        <rect x="0" y="85" width="75" height="50" rx="4" fill="#fce7f3" stroke="#f9a8d4" stroke-width="0.5"/>
