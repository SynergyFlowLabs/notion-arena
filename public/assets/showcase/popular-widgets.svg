      <text x="75" y="20" font-size="11" font-weight="600" fill="#166534" text-anchor="middle">Revenue</text>
      <text x="75" y="45" font-size="24" font-weight="700" fill="#1f1f1f" text-anchor="middle">$48.2k</text>
      <text x="75" y="65" font-size="11" fill="#16a34a" text-anchor="middle">▲ +12.3% vs last month</text>
