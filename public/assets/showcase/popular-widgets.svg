<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1200" height="700" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="600" y="50" font-size="28" font-weight="700" fill="#1f1f1f" text-anchor="middle">Popular Widgets in Notion</text>
  <text x="600" y="80" font-size="16" fill="#6b7280" text-anchor="middle">Real embeds as they appear in Notion pages</text>

  <!-- Widget 1: Pomodoro Timer -->
  <g transform="translate(50, 110)">
    <rect x="0" y="0" width="350" height="280" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="0" y="0" width="350" height="40" rx="12" fill="#f9fafb"/>
    <text x="175" y="26" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">🍅 Pomodoro Timer</text>
    
    <!-- Progress ring -->
    <circle cx="175" cy="160" r="70" stroke="#e5e7eb" stroke-width="12" fill="none"/>
    <circle cx="175" cy="160" r="70" stroke="#e03e3e" stroke-width="12" fill="none" stroke-dasharray="439.8" stroke-dashoffset="132" stroke-linecap="round" transform="rotate(-90 175 160)"/>
    <text x="175" y="158" font-size="32" font-weight="700" fill="#1f1f1f" text-anchor="middle">25:00</text>
    <text x="175" y="190" font-size="13" fill="#6b7280" text-anchor="middle">Deep work • Session 3</text>
    
    <!-- Controls -->
    <g transform="translate(75, 230)">
      <circle cx="50" cy="20" r="20" fill="#e03e3e"/>
      <text x="50" y="26" font-size="16" fill="white" text-anchor="middle">⏸</text>
      <circle cx="150" cy="20" r="20" fill="#f3f4f6"/>
      <text x="150" y="26" font-size="14" fill="#374151" text-anchor="middle">↻</text>
      <circle cx="250" cy="20" r="20" fill="#f3f4f6"/>
      <text x="250" y="26" font-size="14" fill="#374151" text-anchor="middle">+1</text>
    </g>
  </g>

