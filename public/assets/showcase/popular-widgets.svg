        <text x="30" y="18" font-size="42" font-weight="700" fill="#e03e3e" font-family="monospace">15</text>
        <rect x="0" y="42" width="60" height="20" rx="3" fill="#374151"/>
        <text x="30" y="56" font-size="10" fill="#9ca3af" font-family="monospace">SECS</text>
      </g>
    </g>
    
    <text x="175" y="260" font-size="12" fill="#6b7280" text-anchor="middle">Asia/Karachi • Monday, October 12, 2026</text>
