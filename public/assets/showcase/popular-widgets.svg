        <text x="37.5" y="17" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">Backlog</text>
        <rect x="0" y="30" width="75" height="50" rx="4" fill="#fef3c7" stroke="#fde68a" stroke-width="0.5"/>
